name: Prime P1 Probe Fedora Base

on:
  push:
    branches:
      - build/p1-first-light

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Probe pinned Fedora bootc base
        shell: bash
        run: |
          set -euo pipefail
          base='quay.io/fedora/fedora-bootc@sha256:4137efc3eee61ce0f8fb47cdfaed6440b4b60845203ace47a5a81bd406dd3556'
          docker pull "$base"
          docker run --rm --entrypoint /bin/bash "$base" -ceu '
            echo "=== OS ==="
            cat /etc/os-release
            echo "=== REQUIRED PRIME RUNTIME ==="
            test -x /usr/bin/bootc
            test -x /usr/bin/systemd-run
            /usr/bin/bootc --version
            /usr/bin/systemd --version | head -n1
            echo "=== BOOT PACKAGE INVENTORY ==="
            rpm -qa | grep -E "^(bootc|kernel|systemd|grub2|shim|dracut|ukify)" | sort
            echo "=== SYSTEMD BOOT EFI DIRECTORY ==="
            if test -d /usr/lib/systemd/boot/efi; then
              find /usr/lib/systemd/boot/efi -maxdepth 1 -type f -printf "%f\n" | sort
            else
              echo "MISSING:/usr/lib/systemd/boot/efi"
            fi
            echo "=== UKI TOOLING ==="
            if command -v ukify >/dev/null 2>&1; then
              command -v ukify
              ukify --version || true
            else
              echo "MISSING:ukify"
            fi
            echo "=== KERNEL-INSTALL PLUGINS ==="
            find /usr/lib/kernel/install.d -maxdepth 1 -type f -printf "%f\n" 2>/dev/null | sort || true
            echo "=== BOOTC AUTO UPDATE ENABLEMENT ==="
            systemctl is-enabled bootc-fetch-apply-updates.timer 2>&1 || true
            grep -R "bootc-fetch-apply-updates" /usr/lib/systemd /etc/systemd 2>/dev/null || true
          '
