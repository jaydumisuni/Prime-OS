name: Prime P1 composefs seal convergence probe

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read
  packages: read

jobs:
  prove-composefs-seal:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 45
    env:
      SOURCE_SHA: b64fc4c1080e45b0ff3a4d31056e67f24332e964
      BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
      INITIAL_FINAL_DIGEST: 3df022cb8dfa81a54259783a86c08d45c18f8a1473cebe282536100679a65de3e12dc83de9743ba8be57d61cca2b20db769a7a89dc8b22be398f13d6ff126b31
      EXPECTED_ROOTFS_DIGEST: 76a93d6ff724d3ead8b41de13a825b8d972a5f09b777803c370f7f66b5ddef16e93cfe733ac9dae47ba093c5f898765e3aaa0258d7fa205a822dd17bfbaaa67c
      PROBE_TAG: localhost/prime-os:p1-reseal-probe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Authenticate Prime-owned Fedora substrate
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | sudo -n podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prove current digest contradiction and test iterative reseal
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%cI HEAD)" = '2026-08-24T01:11:21+02:00'
          test -c /dev/fuse
          sudo -n podman image exists localhost/prime-os:p1-rootfs
          sudo -n podman image exists localhost/prime-os:p1
          revision="$(sudo -n podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' localhost/prime-os:p1)"
          test "$revision" = "$SOURCE_SHA"

          digest_of() {
            local image="$1"
            sudo -n podman run --rm \
              --privileged \
              --security-opt label=disable \
              --tmpfs /var/tmp:size=8g \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              "$image" \
              bootc container compute-composefs-digest-from-storage "$image" | tail -n1
          }

          rootfs_digest="$(digest_of localhost/prime-os:p1-rootfs)"
          current_final_digest="$(digest_of localhost/prime-os:p1)"
          echo "CURRENT_ROOTFS_DIGEST=$rootfs_digest"
          echo "CURRENT_FINAL_DIGEST=$current_final_digest"
          test "$rootfs_digest" = "$EXPECTED_ROOTFS_DIGEST"
          test "$current_final_digest" = "$INITIAL_FINAL_DIGEST"

          created_at="$(git show -s --format=%cI HEAD)"
          generation_id="p1-first-light-${SOURCE_SHA:0:12}"
          base_digest="sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341"
          seal="$INITIAL_FINAL_DIGEST"
          converged=0

          for round in 1 2 3; do
            echo "=== RESEAL ROUND $round input=$seal ==="
            sudo -n podman build \
              --cap-add=all \
              --device /dev/fuse \
              --security-opt label=disable \
              --platform linux/amd64 \
              --build-arg PRIME_BASE_IMAGE="$BASE_IMAGE" \
              --build-arg PRIME_BASE_DIGEST="$base_digest" \
              --build-arg TARGETARCH=amd64 \
              --build-arg PRIME_GENERATION_ID="$generation_id" \
              --build-arg PRIME_SOURCE_REVISION="$SOURCE_SHA" \
              --build-arg PRIME_CREATED_AT="$created_at" \
              --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
              --build-arg PRIME_COMPOSEFS_DIGEST="$seal" \
              -f image/Containerfile \
              -t "$PROBE_TAG" .

            embedded="$(sudo -n podman run --rm --entrypoint /bin/bash "$PROBE_TAG" -ceu '
              normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"
              recovery="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.recovery.efi" -print -quit)"
              grep -aoE "composefs=[0-9a-f]{128}" "$normal" | head -n1 | cut -d= -f2
              grep -aoE "composefs=[0-9a-f]{128}" "$recovery" | head -n1 | cut -d= -f2
            ')"
            normal="$(printf '%s\n' "$embedded" | sed -n '1p')"
            recovery="$(printf '%s\n' "$embedded" | sed -n '2p')"
            test "$normal" = "$seal"
            test "$recovery" = "$seal"

            next="$(digest_of "$PROBE_TAG")"
            echo "ROUND_${round}_EMBEDDED=$seal"
            echo "ROUND_${round}_FINAL_DIGEST=$next"
            if test "$next" = "$seal"; then
              echo "COMPOSEFS_RESEAL_CONVERGED_ROUND=$round"
              converged=1
              break
            fi
            seal="$next"
          done

          if test "$converged" -eq 0; then
            echo 'COMPOSEFS_RESEAL_NONCONVERGENT=1'
          fi

      - name: Remove ephemeral registry credentials
        if: ${{ always() }}
        shell: bash
        run: |
          sudo -n podman logout ghcr.io >/dev/null 2>&1 || true
