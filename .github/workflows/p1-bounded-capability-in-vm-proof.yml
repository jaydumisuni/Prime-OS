name: Prime P1 rootful bounded AppArmor QCOW2 proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read

jobs:
  prove-rootful-boundary:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 30
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
      BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
      BWRAP_POLICY: /etc/apparmor.d/bwrap-userns-restrict
      LSBLK_POLICY: /etc/apparmor.d/lsblk
      EXPECTED_BWRAP_SHA256: d61facde27707b9c47ffe47921b7273e788784484cb5530eb819e6daac1f1990
      EXPECTED_PRIME_REVISION: b64fc4c1080e45b0ff3a4d31056e67f24332e964
    steps:
      - name: Freeze exact host profiles, Prime image and builder inputs
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/fuse
          test -f "$BWRAP_POLICY"
          test -f "$LSBLK_POLICY"
          actual="$(sha256sum "$BWRAP_POLICY" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_BWRAP_SHA256"
          printf 'LSBLK_POLICY_SHA256=%s\n' "$(sha256sum "$LSBLK_POLICY" | awk '{print $1}')"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(enforce\)$' | wc -l | grep -Fx 3
          sudo -n podman image exists localhost/prime-os:p1
          revision="$(sudo -n podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' localhost/prime-os:p1)"
          echo "LOCAL_PRIME_REVISION=$revision"
          test "$revision" = "$EXPECTED_PRIME_REVISION"
          sudo -n podman image exists "$BASE_IMAGE"
          sudo -n podman image exists "$IMAGE_BUILDER"
          sudo -n podman run --rm "$IMAGE_BUILDER" build --help | grep -F -- '--bootc-build-ref'

      - name: Build QCOW2 rootfully in bounded reversible bwrap plus lsblk complain window
        shell: bash
        run: |
          set -u
          out=/var/tmp/prime-p1-rootful-bounded-qcow2-proof
          bwrap_sha="$(sha256sum "$BWRAP_POLICY" | awk '{print $1}')"
          lsblk_sha="$(sha256sum "$LSBLK_POLICY" | awk '{print $1}')"

          restore_profiles() {
            sudo -n apparmor_parser -r "$BWRAP_POLICY" >/dev/null 2>&1 || true
            sudo -n apparmor_parser -r "$LSBLK_POLICY" >/dev/null 2>&1 || true
          }
          trap restore_profiles EXIT INT TERM

          sudo -n apparmor_parser -r -C "$BWRAP_POLICY"
          sudo -n apparmor_parser -r -C "$LSBLK_POLICY"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(complain\)$' | wc -l | grep -Fx 3

          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          START="$(date '+%Y-%m-%d %H:%M:%S')"

          set +e
          timeout --signal=TERM --kill-after=10s 1200s sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/fuse:/dev/fuse \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-build-ref "$BASE_IMAGE" \
            --bootc-default-fs ext4 \
            --with-manifest \
            --with-buildlog \
            --progress verbose \
            qcow2 2>&1 | tee "$out/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "IMAGE_BUILDER_RC=$rc"

          restore_profiles
          trap - EXIT INT TERM
          test "$(sha256sum "$BWRAP_POLICY" | awk '{print $1}')" = "$bwrap_sha"
          test "$(sha256sum "$LSBLK_POLICY" | awk '{print $1}')" = "$lsblk_sha"
          test "$bwrap_sha" = "$EXPECTED_BWRAP_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(enforce\)$' | wc -l | grep -Fx 3
          echo "RESTORED_BWRAP_POLICY_SHA256=$bwrap_sha"
          echo "RESTORED_LSBLK_POLICY_SHA256=$lsblk_sha"

          old_mount=0
          old_overlay=0
          old_lsblk=0
          grep -Fq 'mount: /run/osbuild/containers/storage: permission denied' "$out/probe.log" && old_mount=1
          grep -Fq "'overlay' is not supported over tmpfs" "$out/probe.log" && old_overlay=1
          grep -Fq 'Listing device /dev/loop' "$out/probe.log" && old_lsblk=1
          echo "OLD_APPARMOR_MOUNT_FAILURE=$old_mount"
          echo "OLD_FUSE_OVERLAY_FAILURE=$old_overlay"
          echo "OLD_LSBLK_DEVICE_FAILURE=$old_lsblk"
          echo '=== relevant rootful boundary evidence ==='
          grep -E 'org.osbuild.container-deploy|org.osbuild.bootc.install-to-filesystem|Pipeline image|Pipeline qcow2|Results saved|Success|Failed|error:|Listing device|mount: /run/osbuild/containers/storage' "$out/probe.log" | tail -n 480 || true
          echo '=== AppArmor audit during bounded window ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor=.*(unpriv_bwrap|bwrap|lsblk)' | tail -n 200 || true

          test "$old_mount" -eq 0
          test "$old_overlay" -eq 0
          test "$old_lsblk" -eq 0
          test "$rc" -eq 0
          qcow="$(find "$out" -type f -name '*.qcow2' -print -quit)"
          test -n "$qcow"
          qemu-img info "$qcow"
          qemu-img check "$qcow"
          echo ROOTFUL_BOUNDED_QCOW2_BOUNDARY=PROVEN
