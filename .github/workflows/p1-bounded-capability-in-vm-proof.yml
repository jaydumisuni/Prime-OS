name: Prime P1 installed UKI survivor probe

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: read

jobs:
  identify-installed-uki:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 8
    env:
      QCOW2: /var/tmp/prime-p1-local-proof/run/output/bootc-prime-0.1-qcow2-x86_64.qcow2
      NBD: /dev/nbd1
      MNT: /var/tmp/prime-p1-installed-uki-probe-esp
      COPY: /var/tmp/prime-p1-installed-uki-probe.efi
    steps:
      - name: Identify the single UKI bootc installed
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QCOW2"
          sudo -n podman image exists localhost/prime-os:p1

          cleanup() {
            sudo -n umount "$MNT" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
            rm -f "$COPY"
          }
          trap cleanup EXIT
          cleanup
          mkdir -p "$MNT"

          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --read-only --connect="$NBD" "$QCOW2"
          sleep 2
          sudo -n partprobe "$NBD"
          ESP="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1; exit}')"
          test -n "$ESP"
          sudo -n mount -o ro "$ESP" "$MNT"

          mapfile -t installed < <(sudo -n find "$MNT/EFI/Linux/bootc" -maxdepth 1 -type f -name '*.efi' -print | sort)
          test "${#installed[@]}" -eq 1
          sudo -n cp "${installed[0]}" "$COPY"
          sudo -n chown "$(id -u):$(id -g)" "$COPY"
          installed_sha="$(sha256sum "$COPY" | awk '{print $1}')"
          echo "INSTALLED_UKI_PATH=${installed[0]#$MNT}"
          echo "INSTALLED_UKI_SHA256=$installed_sha"

          source_hashes="$(sudo -n podman run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"
            recovery="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.recovery.efi" -print -quit)"
            test -n "$normal"; test -n "$recovery"
            printf "NORMAL %s\n" "$(sha256sum "$normal" | awk "{print \\$1}")"
            printf "RECOVERY %s\n" "$(sha256sum "$recovery" | awk "{print \\$1}")"
          ')"
          printf '%s\n' "$source_hashes"
          normal_sha="$(printf '%s\n' "$source_hashes" | awk '$1=="NORMAL" {print $2}')"
          recovery_sha="$(printf '%s\n' "$source_hashes" | awk '$1=="RECOVERY" {print $2}')"
          test -n "$normal_sha"; test -n "$recovery_sha"

          if [[ "$installed_sha" == "$normal_sha" ]]; then
            survivor=NORMAL
          elif [[ "$installed_sha" == "$recovery_sha" ]]; then
            survivor=RECOVERY
          else
            survivor=NEITHER
          fi
          echo "INSTALLED_SURVIVOR=$survivor"

          echo '=== installed UKI inspect ==='
          sudo -n podman run --rm --security-opt label=disable -v "$COPY:/tmp/installed.efi:ro" --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            ukify --json=short inspect /tmp/installed.efi > /tmp/inspect.json
            python3 - <<"PY"
import json
x=json.load(open("/tmp/inspect.json"))
print("CMDLINE=" + x[".cmdline"]["text"].strip())
print("OSREL=" + x[".osrel"]["text"].replace("\n", " | "))
PY
          '

          echo '=== installed systemd-boot entries ==='
          sudo -n find "$MNT/loader/entries" -maxdepth 1 -type f -name '*.conf' -print -exec sh -c 'echo --- "$1"; cat "$1"' _ {} \;

          test "$survivor" != NEITHER
          echo INSTALLED_UKI_SURVIVOR_PROBE=PROVEN
