name: Prime P1 bounded capability plus Fedora buildroot VM proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read

jobs:
  prove-composed-boundary:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 15
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
      BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
      POLICY: /etc/apparmor.d/bwrap-userns-restrict
      EXPECTED_POLICY_SHA256: d61facde27707b9c47ffe47921b7273e788784484cb5530eb819e6daac1f1990
      EXPECTED_PRIME_REVISION: b64fc4c1080e45b0ff3a4d31056e67f24332e964
    steps:
      - name: Freeze exact host, policy, Prime image, Fedora buildroot and builder
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test -c /dev/fuse
          actual="$(sha256sum "$POLICY" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_POLICY_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$' | wc -l | grep -Fx 2

          sudo -n podman image exists localhost/prime-os:p1
          revision="$(sudo -n podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' localhost/prime-os:p1)"
          echo "LOCAL_PRIME_REVISION=$revision"
          test "$revision" = "$EXPECTED_PRIME_REVISION"

          sudo -n podman image exists "$BASE_IMAGE"
          sudo -n podman run --rm --entrypoint /bin/bash "$BASE_IMAGE" -ceu '
            kernel_dir="$(find /usr/lib/modules -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$kernel_dir"
            test -f "$kernel_dir/vmlinuz"
            printf "FEDORA_BUILDROOT_KERNEL_DIR=%s\n" "$kernel_dir"
            printf "FEDORA_BUILDROOT_VMLINUZ=%s\n" "$kernel_dir/vmlinuz"
          '

          sudo -n podman run --rm "$IMAGE_BUILDER" build --help | grep -F -- '--in-vm'
          sudo -n podman run --rm "$IMAGE_BUILDER" build --help | grep -F -- '--bootc-build-ref'

      - name: Build QCOW2 with bounded build-pipeline capability window and pinned Fedora VM buildroot
        shell: bash
        run: |
          set -u
          tmp_policy=/tmp/prime-p1-bwrap-userns-restrict
          out=/var/tmp/prime-p1-fedora-buildroot-in-vm-proof

          restore_policy() {
            sudo -n apparmor_parser -r "$POLICY" >/dev/null 2>&1 || true
          }
          trap restore_policy EXIT INT TERM

          python3 - <<'PY'
          from pathlib import Path
          src = Path('/etc/apparmor.d/bwrap-userns-restrict').read_text()
          needle = '  audit deny capability,\n'
          if src.count(needle) != 1:
              raise SystemExit(f'expected one child capability deny, found {src.count(needle)}')
          replacement = '''  # Prime P1 proof-only build-pipeline window for the exact pinned image-builder.\n  allow capability,\n'''
          Path('/tmp/prime-p1-bwrap-userns-restrict').write_text(src.replace(needle, replacement, 1))
          PY
          sudo -n apparmor_parser -r "$tmp_policy"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$' | wc -l | grep -Fx 2

          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          START="$(date '+%Y-%m-%d %H:%M:%S')"

          set +e
          timeout --signal=TERM 600s sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/kvm:/dev/kvm \
            --device /dev/fuse:/dev/fuse \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --in-vm \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-build-ref "$BASE_IMAGE" \
            --bootc-default-fs ext4 \
            --with-manifest \
            --with-buildlog \
            --progress verbose \
            qcow2 2>&1 | tee "$out/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "IMAGE_BUILDER_RC=$rc"

          restore_policy
          trap - EXIT INT TERM
          restored="$(sha256sum "$POLICY" | awk '{print $1}')"
          echo "RESTORED_POLICY_SHA256=$restored"
          test "$restored" = "$EXPECTED_POLICY_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$' | wc -l | grep -Fx 2

          old_mount=0
          old_lsblk=0
          old_kernel=0
          grep -Fq 'mount: /run/osbuild/containers/storage: permission denied' "$out/probe.log" && old_mount=1
          grep -Fq 'Listing device /dev/loop' "$out/probe.log" && old_lsblk=1
          grep -Fq 'No valid kernel directory found in /usr/lib/modules' "$out/probe.log" && old_kernel=1
          echo "OLD_INNER_MOUNT_FAILURE=$old_mount"
          echo "OLD_LSBLK_FAILURE=$old_lsblk"
          echo "OLD_VM_KERNEL_FAILURE=$old_kernel"
          echo '=== relevant composed-boundary evidence ==='
          grep -E 'org.osbuild.container-deploy|org.osbuild.bootc.install-to-filesystem|Pipeline image|in vm|qemu|KVM|Success|Failed|error:' "$out/probe.log" | tail -n 320 || true
          echo '=== host bwrap audit during composed window ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor=.*(unpriv_bwrap|bwrap)' | tail -n 120 || true

          test "$old_mount" -eq 0
          test "$old_lsblk" -eq 0
          test "$old_kernel" -eq 0
          test "$rc" -eq 0
          qcow="$(find "$out" -type f -name '*.qcow2' -print -quit)"
          test -n "$qcow"
          qemu-img info "$qcow"
          echo FEDORA_BUILDROOT_VM_BOUNDARY=PROVEN
