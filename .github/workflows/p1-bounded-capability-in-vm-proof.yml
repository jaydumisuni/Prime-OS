name: Prime P1 composefs digest-view probe

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read

jobs:
  inspect-composefs-views:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 12
    env:
      SOURCE_SHA: b64fc4c1080e45b0ff3a4d31056e67f24332e964
      ROOTFS_IMAGE: localhost/prime-os:p1-rootfs
      FINAL_IMAGE: localhost/prime-os:p1
      EXPECTED_ROOTFS_DIGEST: 76a93d6ff724d3ead8b41de13a825b8d972a5f09b777803c370f7f66b5ddef16e93cfe733ac9dae47ba093c5f898765e3aaa0258d7fa205a822dd17bfbaaa67c
      EXPECTED_FINAL_DIGEST: 3df022cb8dfa81a54259783a86c08d45c18f8a1473cebe282536100679a65de3e12dc83de9743ba8be57d61cca2b20db769a7a89dc8b22be398f13d6ff126b31
    steps:
      - name: Freeze exact local images and tool versions
        shell: bash
        run: |
          set -euo pipefail
          sudo -n podman image exists "$ROOTFS_IMAGE"
          sudo -n podman image exists "$FINAL_IMAGE"
          revision="$(sudo -n podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$FINAL_IMAGE")"
          test "$revision" = "$SOURCE_SHA"
          echo '=== rootfs bootc version ==='
          sudo -n podman run --rm "$ROOTFS_IMAGE" bootc --version
          sudo -n podman run --rm "$ROOTFS_IMAGE" rpm -q bootc composefs composefs-libs 2>/dev/null || true
          echo '=== final bootc version ==='
          sudo -n podman run --rm "$FINAL_IMAGE" bootc --version
          sudo -n podman run --rm "$FINAL_IMAGE" rpm -q bootc composefs composefs-libs 2>/dev/null || true

      - name: Diff exact storage-view Composefs trees
        shell: bash
        run: |
          set -euo pipefail
          out=/var/tmp/prime-p1-composefs-view-probe
          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"

          digest_dump() {
            local image="$1"
            local dump="$2"
            sudo -n podman run --rm \
              --privileged \
              --security-opt label=disable \
              --tmpfs /var/tmp:size=8g \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v "$out:/out" \
              "$image" \
              bootc container compute-composefs-digest-from-storage \
                --write-dumpfile-to "/out/$dump" "$image" | tail -n1
          }

          rootfs_digest="$(digest_dump "$ROOTFS_IMAGE" rootfs.dump)"
          final_digest="$(digest_dump "$FINAL_IMAGE" final.dump)"
          echo "ROOTFS_STORAGE_DIGEST=$rootfs_digest"
          echo "FINAL_STORAGE_DIGEST=$final_digest"
          test "$rootfs_digest" = "$EXPECTED_ROOTFS_DIGEST"
          test "$final_digest" = "$EXPECTED_FINAL_DIGEST"

          echo '=== exact dump diff ==='
          set +e
          diff -u "$out/rootfs.dump" "$out/final.dump" > "$out/diff.txt"
          diff_rc=$?
          set -e
          test "$diff_rc" -eq 1
          wc -l "$out/rootfs.dump" "$out/final.dump" "$out/diff.txt"
          cat "$out/diff.txt"
          echo '=== changed top-level paths ==='
          awk '/^[+-]\// && !/^---/ && !/^\+\+\+/ {line=substr($0,2); split(line,a,"/"); if (a[2] != "") print "/" a[2]}' "$out/diff.txt" | sort | uniq -c

          echo '=== UKI inventory ==='
          sudo -n podman run --rm --entrypoint /bin/bash "$FINAL_IMAGE" -ceu '
            find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" -printf "%f %s bytes\n" | sort
          '

          echo COMPOSEFS_STORAGE_VIEW_DIFF=PROVEN
