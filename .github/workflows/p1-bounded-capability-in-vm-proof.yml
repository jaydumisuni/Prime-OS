name: Prime P1 pre-seal RPM cleanup QCOW2 proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read
  packages: read

jobs:
  prove-preseal-cleanup:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 35
    env:
      SOURCE_SHA: b64fc4c1080e45b0ff3a4d31056e67f24332e964
      BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
      BWRAP_POLICY: /etc/apparmor.d/bwrap-userns-restrict
      LSBLK_POLICY: /etc/apparmor.d/lsblk
      EXPECTED_BWRAP_SHA256: d61facde27707b9c47ffe47921b7273e788784484cb5530eb819e6daac1f1990
      EXPECTED_LSBLK_SHA256: 6b3097d4b9fc10c34bc593c5fed2c95af86d619eb68fa7611f98b55cec841569
      FIXED_ROOTFS: localhost/prime-os:p1-preseal-rootfs
      FIXED_FINAL: localhost/prime-os:p1-preseal
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Authenticate frozen inputs and rebuild canonical Core artifacts
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(rustc --version | awk '{print $2}')" = '1.97.1'
          printf '%s' "$GHCR_TOKEN" | sudo -n podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo -n podman pull "$BASE_IMAGE"
          sudo -n podman pull "$IMAGE_BUILDER"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked --release -p primed
          test -x target/release/primed
          test -x target/release/prime-recovery

      - name: Construct one-boundary Containerfile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp image/Containerfile image/Containerfile.preseal-probe
          python3 - <<'PY'
          from pathlib import Path
          p = Path('image/Containerfile.preseal-probe')
          s = p.read_text()
          marker = 'FROM split AS sealed-rootfs\n'
          start = s.index(marker)
          end = s.index('\nFROM rootfs AS uki-tools', start)
          sealed = s[start:end]
          needle = "    ! find /usr/lib/modules -type f \\( -name vmlinuz -o -name initramfs.img \\) -print -quit | grep -q ."
          if needle not in sealed:
              raise SystemExit('sealed-rootfs insertion point missing')
          sealed = sealed.replace(
              needle,
              needle + "; \\\n    ! rpm -q bootupd >/dev/null 2>&1; \\\n    rm -f /usr/share/rpm/rpmdb.sqlite-shm /usr/share/rpm/rpmdb.sqlite-wal; \\\n    test ! -e /usr/share/rpm/rpmdb.sqlite-shm; \\\n    test ! -e /usr/share/rpm/rpmdb.sqlite-wal",
              1,
          )
          s = s[:start] + sealed + s[end:]

          final_start = s.index('FROM sealed-rootfs AS final\n')
          head, final = s[:final_start], s[final_start:]
          for line in (
              "    ! rpm -q bootupd >/dev/null 2>&1; \\\n",
              "    rm -f /usr/share/rpm/rpmdb.sqlite-shm /usr/share/rpm/rpmdb.sqlite-wal; \\\n",
          ):
              if line not in final:
                  raise SystemExit(f'final mutation line missing: {line!r}')
              final = final.replace(line, '', 1)
          p.write_text(head + final)
          PY
          echo '=== sealed/final diagnostic diff ==='
          diff -u image/Containerfile image/Containerfile.preseal-probe || true
          grep -nE 'sealed-rootfs|rpm -q bootupd|rpmdb.sqlite-(shm|wal)|FROM sealed-rootfs AS final' image/Containerfile.preseal-probe

      - name: Prove fixed sealed and final Composefs digests are identical
        shell: bash
        run: |
          set -euo pipefail
          created_at="$(git show -s --format=%cI HEAD)"
          generation_id="p1-first-light-${SOURCE_SHA:0:12}"
          base_digest="sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341"

          build_common=(
            --cap-add=all
            --device /dev/fuse
            --security-opt label=disable
            --platform linux/amd64
            --build-arg PRIME_BASE_IMAGE="$BASE_IMAGE"
            --build-arg PRIME_BASE_DIGEST="$base_digest"
            --build-arg TARGETARCH=amd64
            --build-arg PRIME_GENERATION_ID="$generation_id"
            --build-arg PRIME_SOURCE_REVISION="$SOURCE_SHA"
            --build-arg PRIME_CREATED_AT="$created_at"
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3
            -f image/Containerfile.preseal-probe
          )

          sudo -n podman build "${build_common[@]}" --target sealed-rootfs -t "$FIXED_ROOTFS" .

          digest_of() {
            local image="$1"
            sudo -n podman run --rm \
              --privileged \
              --security-opt label=disable \
              --tmpfs /var/tmp:size=8g \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              "$image" \
              bootc container compute-composefs-digest-from-storage "$image" | tail -n1
          }

          canonical="$(digest_of "$FIXED_ROOTFS")"
          case "$canonical" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "FIXED_CANONICAL_DIGEST=$canonical"

          sudo -n podman build "${build_common[@]}" \
            --build-arg PRIME_COMPOSEFS_DIGEST="$canonical" \
            -t "$FIXED_FINAL" .

          final="$(digest_of "$FIXED_FINAL")"
          echo "FIXED_FINAL_DIGEST=$final"
          test "$final" = "$canonical"

          embedded="$(sudo -n podman run --rm --entrypoint /bin/bash "$FIXED_FINAL" -ceu '
            normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"
            recovery="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.recovery.efi" -print -quit)"
            grep -aoE "composefs=[0-9a-f]{128}" "$normal" | head -n1 | cut -d= -f2
            grep -aoE "composefs=[0-9a-f]{128}" "$recovery" | head -n1 | cut -d= -f2
          ')"
          normal="$(printf '%s\n' "$embedded" | sed -n '1p')"
          recovery="$(printf '%s\n' "$embedded" | sed -n '2p')"
          echo "FIXED_NORMAL_UKI_DIGEST=$normal"
          echo "FIXED_RECOVERY_UKI_DIGEST=$recovery"
          test "$normal" = "$canonical"
          test "$recovery" = "$canonical"
          echo PRESEAL_RPM_CLEANUP_DIGEST=PROVEN

      - name: Build QCOW2 through the proven rootful bounded AppArmor window
        shell: bash
        run: |
          set -u
          test "$(sha256sum "$BWRAP_POLICY" | awk '{print $1}')" = "$EXPECTED_BWRAP_SHA256"
          test "$(sha256sum "$LSBLK_POLICY" | awk '{print $1}')" = "$EXPECTED_LSBLK_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(enforce\)$' | wc -l | grep -Fx 3

          out=/var/tmp/prime-p1-preseal-cleanup-qcow2-proof
          restore_profiles() {
            sudo -n apparmor_parser -r "$BWRAP_POLICY" >/dev/null 2>&1 || true
            sudo -n apparmor_parser -r "$LSBLK_POLICY" >/dev/null 2>&1 || true
          }
          trap restore_profiles EXIT INT TERM

          sudo -n apparmor_parser -r -C "$BWRAP_POLICY"
          sudo -n apparmor_parser -r -C "$LSBLK_POLICY"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(complain\)$' | wc -l | grep -Fx 3

          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          START="$(date '+%Y-%m-%d %H:%M:%S')"

          set +e
          timeout --signal=TERM --kill-after=10s 1200s sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/fuse:/dev/fuse \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --bootc-ref "$FIXED_FINAL" \
            --bootc-build-ref "$BASE_IMAGE" \
            --bootc-default-fs ext4 \
            --with-manifest \
            --with-buildlog \
            --progress verbose \
            qcow2 2>&1 | tee "$out/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "IMAGE_BUILDER_RC=$rc"

          restore_profiles
          trap - EXIT INT TERM
          test "$(sha256sum "$BWRAP_POLICY" | awk '{print $1}')" = "$EXPECTED_BWRAP_SHA256"
          test "$(sha256sum "$LSBLK_POLICY" | awk '{print $1}')" = "$EXPECTED_LSBLK_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap|lsblk) \(enforce\)$' | wc -l | grep -Fx 3

          echo '=== terminal QCOW2 evidence ==='
          grep -E 'org.osbuild.bootc.install-to-filesystem|The UKI has the wrong composefs|Pipeline qcow2|Results saved|Success|Failed|error:' "$out/probe.log" | tail -n 320 || true
          echo '=== bounded AppArmor evidence ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor=.*(unpriv_bwrap|bwrap|lsblk)' | tail -n 120 || true

          test "$rc" -eq 0
          qcow="$(find "$out" -type f -name '*.qcow2' -print -quit)"
          test -n "$qcow"
          qemu-img info "$qcow"
          qemu-img check "$qcow"
          echo PRESEAL_RPM_CLEANUP_QCOW2=PROVEN

      - name: Remove ephemeral registry credentials
        if: ${{ always() }}
        shell: bash
        run: |
          sudo -n podman logout ghcr.io >/dev/null 2>&1 || true
