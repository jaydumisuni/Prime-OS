name: Prime P1 post-bootc Core evidence

on:
  push:
    branches:
      - adapter/p1-image-builder-mount-probe

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 5
    env:
      DISK: /var/tmp/prime-p1-core-recovery-proof/proof.qcow2
      SERIAL: /var/tmp/prime-p1-core-recovery-proof/serial.log
      STATE: /var/tmp/prime-p1-post-bootc-core-evidence
      NBD: /dev/nbd1
    steps:
      - name: Recover state and journal after bootc RC zero
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$STATE"; mkdir -p "$STATE/root"
          test -f "$DISK"
          test -f "$SERIAL"

          echo SERIAL_CORE_MARKERS_BEGIN
          grep -E -i 'CORE_BOOTC_STATUS_RC=0|primed:|primed\[|Error:|generation|hardware|storage|core.sock|panic|fatal' "$SERIAL" | tail -n 1000 || true
          echo SERIAL_CORE_MARKERS_END

          qemu-img check "$DISK" || true
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$DISK")" "$STATE/replay.qcow2"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --connect="$NBD" "$STATE/replay.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e
          sudo -n e2fsck -fy "$ROOT"
          FSCK_RC=$?
          set -e
          test $((FSCK_RC & 12)) -eq 0
          echo "EVIDENCE_FSCK_RC=$FSCK_RC"
          sudo -n mount -o ro "$ROOT" "$STATE/root"

          PRIME="$STATE/root/state/os/default/var/lib/prime"
          echo PRIME_TREE_BEGIN
          if sudo -n test -d "$PRIME"; then sudo -n find "$PRIME" -maxdepth 5 -printf '%y %P -> %l\n' | sort; fi
          echo PRIME_TREE_END
          for rel in identity/host.json generations/current.json hardware/current.json storage/current.json first-light/mechanical.json; do
            if sudo -n test -f "$PRIME/$rel"; then
              echo "PRIME_FILE_BEGIN=$rel"
              sudo -n cat "$PRIME/$rel"
              echo "PRIME_FILE_END=$rel"
            else
              echo "PRIME_FILE_MISSING=$rel"
            fi
          done

          echo JOURNAL_CORE_BEGIN
          while IFS= read -r jroot; do
            echo "JOURNAL_ROOT=${jroot#$STATE/root}"
            sudo -n journalctl --directory="$jroot" --no-pager -o short-precise -u primed.service -u prime-compositor.service -u prime-shell.service -u prime-first-light-witness.service 2>&1 | tail -n 1500 || true
          done < <(sudo -n find "$STATE/root" -type d -path '*/var/log/journal' -print 2>/dev/null | head -n 8)
          echo JOURNAL_CORE_END

          test -f "$PRIME/generations/current.json"
          sudo -n python3 - "$PRIME/generations/current.json" <<'PY'
          import json,sys
          g=json.load(open(sys.argv[1]))
          print('POST_BOOTC_GENERATION_STATE='+g['state'])
          print('POST_BOOTC_EVIDENCE_REFS='+','.join(g.get('evidence_refs', [])))
          PY
          echo POST_BOOTC_GENERATION_PERSISTED=PASS
