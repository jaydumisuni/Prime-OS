name: Prime P1 post-XDG gate evidence

on:
  push:
    branches:
      - adapter/p1-image-builder-mount-probe

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 5
    env:
      DISK: /var/tmp/prime-p1-compositor-xdg-proof/proof.qcow2
      SERIAL: /var/tmp/prime-p1-compositor-xdg-proof/serial.log
      STATE: /var/tmp/prime-p1-post-xdg-evidence
      NBD: /dev/nbd1
    steps:
      - name: Replay post-XDG boot state and classify gates
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$STATE"; mkdir -p "$STATE/root"
          test -f "$DISK"; test -f "$SERIAL"

          echo POST_XDG_SERIAL_BEGIN
          grep -E -i 'PRIME_PAM_XDG|PRIME_XDG_|primed:|prime-compositor|prime-shell|SHELL_READY|Wayland|frame|Error:|Failed with result|Main process exited' "$SERIAL" | tail -n 1800 || true
          echo POST_XDG_SERIAL_END

          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$DISK")" "$STATE/replay.qcow2"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --connect="$NBD" "$STATE/replay.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e; sudo -n e2fsck -fy "$ROOT"; FSCK_RC=$?; set -e
          test $((FSCK_RC & 12)) -eq 0
          sudo -n mount -o ro "$ROOT" "$STATE/root"
          PRIME="$STATE/root/state/os/default/var/lib/prime"

          echo PRIME_POST_XDG_FILES_BEGIN
          sudo -n find "$PRIME" -maxdepth 6 -type f -printf '%P\n' 2>/dev/null | sort || true
          echo PRIME_POST_XDG_FILES_END
          for rel in identity/host.json generations/current.json hardware/current.json storage/current.json first-light/mechanical.json; do
            if sudo -n test -f "$PRIME/$rel"; then
              echo "PRIME_POST_XDG_BEGIN=$rel"
              sudo -n cat "$PRIME/$rel"
              echo "PRIME_POST_XDG_END=$rel"
            else
              echo "PRIME_POST_XDG_MISSING=$rel"
            fi
          done

          echo POST_XDG_JOURNAL_BEGIN
          while IFS= read -r jroot; do
            sudo -n journalctl --directory="$jroot" --no-pager -o short-precise \
              -u primed.service -u prime-compositor.service -u prime-shell.service -u prime-first-light-witness.service 2>&1 | tail -n 1800 || true
          done < <(sudo -n find "$STATE/root" -type d -path '*/var/log/journal' -print 2>/dev/null | head -n 8)
          echo POST_XDG_JOURNAL_END

          if sudo -n test -f "$PRIME/generations/current.json"; then
            sudo -n python3 - "$PRIME/generations/current.json" <<'PY'
          import json,sys
          g=json.load(open(sys.argv[1]))
          print('POST_XDG_GENERATION_STATE='+g['state'])
          print('POST_XDG_EVIDENCE_REFS='+','.join(g.get('evidence_refs', [])))
          PY
          fi
          if sudo -n test -f "$PRIME/first-light/mechanical.json"; then
            sudo -n python3 - "$PRIME/first-light/mechanical.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print('POST_XDG_FIRST_LIGHT_STATUS='+str(d.get('status')))
          print('POST_XDG_SHELL_READY='+str(d.get('shell_ready')))
          print('POST_XDG_FRAME_LOOP_READY='+str(d.get('frame_loop_ready')))
          print('POST_XDG_WAYLAND_LISTENER_READY='+str(d.get('wayland_listener_ready')))
          print('POST_XDG_CLIENTS_ACCEPTED='+str(d.get('clients_accepted')))
          print('POST_XDG_MAPPED_FRAMES='+str(d.get('mapped_surface_frames_submitted')))
          PY
          fi
          echo POST_XDG_GATE_EVIDENCE_RECOVERED=PASS
