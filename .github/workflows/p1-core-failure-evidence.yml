name: Prime P1 compositor failure evidence

on:
  push:
    branches:
      - adapter/p1-image-builder-mount-probe

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 6
    env:
      BASE: /var/tmp/prime-p1-core-recovery-proof/proof.qcow2
      STATE: /var/tmp/prime-p1-compositor-evidence
      NBD: /dev/nbd1
      OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OVMF_VARS_TEMPLATE: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Build logging-only compositor evidence overlay
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$STATE"; mkdir -p "$STATE/root"
          test -f "$BASE"
          qemu-img check "$BASE" || true
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$BASE")" "$STATE/evidence.qcow2"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --connect="$NBD" "$STATE/evidence.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e
          sudo -n e2fsck -fy "$ROOT"
          FSCK_RC=$?
          set -e
          test $((FSCK_RC & 12)) -eq 0
          sudo -n mount "$ROOT" "$STATE/root"
          DEPLOY_ETC="$(sudo -n find "$STATE/root/state/deploy" -mindepth 2 -maxdepth 2 -type d -name etc -print | head -n1)"
          test -n "$DEPLOY_ETC"
          sudo -n mkdir -p "$DEPLOY_ETC/systemd/system/prime-compositor.service.d"
          cat <<'EOF' | sudo -n tee "$DEPLOY_ETC/systemd/system/prime-compositor.service.d/10-error-evidence.conf" >/dev/null
          [Service]
          Restart=no
          StandardOutput=journal+console
          StandardError=journal+console
          Environment=RUST_BACKTRACE=full
          EOF
          echo COMPOSITOR_EVIDENCE_DROPIN_BEGIN
          sudo -n cat "$DEPLOY_ETC/systemd/system/prime-compositor.service.d/10-error-evidence.conf"
          echo COMPOSITOR_EVIDENCE_DROPIN_END
          sudo -n sync
          cleanup
          cp "$OVMF_VARS_TEMPLATE" "$STATE/vars.fd"

      - name: Boot exact corrected EFI path and capture compositor error
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 105s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$STATE/vars.fd" \
            -drive file="$STATE/evidence.qcow2",if=virtio,format=qcow2 \
            -display none \
            -serial "file:$STATE/serial.log" \
            -monitor none \
            -net none \
            -no-reboot
          RC=$?
          set -e
          test "$RC" -eq 0 -o "$RC" -eq 124 -o "$RC" -eq 143
          echo COMPOSITOR_SERIAL_EVIDENCE_BEGIN
          grep -E -i 'prime-compositor|libseat|seat|DRM|GPU|GBM|EGL|GLES|render|udev|Permission denied|No such|Error:|failed' "$STATE/serial.log" | tail -n 1200 || true
          echo COMPOSITOR_SERIAL_EVIDENCE_END

      - name: Replay journal and require exact compositor error evidence
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/replay-root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          mkdir -p "$STATE/replay-root"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$STATE/evidence.qcow2")" "$STATE/replay.qcow2"
          sudo -n qemu-nbd --connect="$NBD" "$STATE/replay.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e
          sudo -n e2fsck -fy "$ROOT"
          FSCK_RC=$?
          set -e
          test $((FSCK_RC & 12)) -eq 0
          sudo -n mount -o ro "$ROOT" "$STATE/replay-root"
          echo COMPOSITOR_JOURNAL_EVIDENCE_BEGIN
          FOUND=0
          while IFS= read -r jroot; do
            sudo -n journalctl --directory="$jroot" --no-pager -o short-precise -u prime-compositor.service 2>&1 | tail -n 1000 | tee "$STATE/compositor-journal.txt"
            if grep -E -i 'Error:|libseat|DRM|GPU|GBM|EGL|GLES|udev|Permission denied|No such|inactive' "$STATE/compositor-journal.txt" >/dev/null; then FOUND=1; fi
          done < <(sudo -n find "$STATE/replay-root" -type d -path '*/var/log/journal' -print 2>/dev/null | head -n 8)
          echo COMPOSITOR_JOURNAL_EVIDENCE_END
          test "$FOUND" -eq 1
          echo COMPOSITOR_EXACT_ERROR_CAPTURED=PASS
