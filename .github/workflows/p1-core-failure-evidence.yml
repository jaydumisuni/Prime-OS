name: Prime P1 bootloader entry inventory

on:
  push:
    branches:
      - adapter/p1-image-builder-mount-probe

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 5
    env:
      DISK: /var/tmp/prime-p1-local-proof/run/output/bootc-prime-0.1-qcow2-x86_64.qcow2
      STATE: /var/tmp/prime-p1-entry-inventory
      NBD: /dev/nbd1
    steps:
      - name: Inventory installed BLS and EFI artifacts
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/esp" >/dev/null 2>&1 || true
            sudo -n umount "$STATE/xboot" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$STATE"; mkdir -p "$STATE/esp" "$STATE/xboot"
          test -f "$DISK"
          qemu-img check "$DISK"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --read-only --connect="$NBD" "$DISK"
          sleep 2; sudo -n partprobe "$NBD"
          echo PARTITIONS_BEGIN
          lsblk -b -o NAME,SIZE,TYPE,FSTYPE,PARTTYPE,PARTLABEL "$NBD"
          echo PARTITIONS_END
          ESP="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1; exit}')"
          XBOOT="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="bc13c2ff-59e6-4262-a352-b275fd6f7172" {print $1; exit}')"
          test -n "$ESP"
          sudo -n mount -o ro "$ESP" "$STATE/esp"
          if test -n "$XBOOT"; then sudo -n mount -o ro "$XBOOT" "$STATE/xboot"; fi

          for root in "$STATE/esp" "$STATE/xboot"; do
            sudo -n test -d "$root" || continue
            echo "ROOT_BEGIN=${root#$STATE/}"
            sudo -n find "$root" -maxdepth 6 -type f -printf '%P\n' | sort | head -n 500
            for d in "$root/loader/entries" "$root/loader/entries.staged"; do
              sudo -n test -d "$d" || continue
              echo "ENTRY_DIR_BEGIN=${d#$root/}"
              while IFS= read -r f; do
                echo "ENTRY_FILE_BEGIN=${f#$root/}"
                sudo -n cat "$f"
                echo "ENTRY_FILE_END=${f#$root/}"
              done < <(sudo -n find "$d" -maxdepth 1 -type f -name '*.conf' -print | sort)
              echo "ENTRY_DIR_END=${d#$root/}"
            done
            echo "ROOT_END=${root#$STATE/}"
          done

          echo UKI_PREFIX_AUDIT_BEGIN
          while IFS= read -r f; do
            key="$(sudo -n awk '$1=="uki" || $1=="efi" {print $1; exit}' "$f")"
            path="$(sudo -n awk '$1=="uki" || $1=="efi" {print $2; exit}' "$f")"
            test -n "$key" || continue
            base="${path##*/}"
            printf 'BLS=%s KEY=%s PATH=%s BASENAME=%s PREFIX_OK=' "${f#$STATE/}" "$key" "$path" "$base"
            case "$base" in bootc_composefs-*.efi) echo YES ;; *) echo NO ;; esac
          done < <(sudo -n find "$STATE/esp" "$STATE/xboot" -type f -path '*/loader/entries*/*.conf' -print 2>/dev/null | sort)
          echo UKI_PREFIX_AUDIT_END
