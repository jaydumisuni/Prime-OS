name: Prime P1 clean compositor launch proof

on:
  push:
    branches:
      - adapter/p1-image-builder-mount-probe

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 7
    env:
      BASE: /var/tmp/prime-p1-core-recovery-proof/proof.qcow2
      STATE: /var/tmp/prime-p1-clean-compositor-launch
      NBD: /dev/nbd1
      OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OVMF_VARS_TEMPLATE: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Build exact product-form launch overlay
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$STATE"; mkdir -p "$STATE/root"
          test -f "$BASE"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$BASE")" "$STATE/proof.qcow2"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --connect="$NBD" "$STATE/proof.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e; sudo -n e2fsck -fy "$ROOT"; FSCK_RC=$?; set -e
          test $((FSCK_RC & 12)) -eq 0
          sudo -n mount "$ROOT" "$STATE/root"
          DEPLOY_ETC="$(sudo -n find "$STATE/root/state/deploy" -mindepth 2 -maxdepth 2 -type d -name etc -print | head -n1)"
          test -n "$DEPLOY_ETC"
          sudo -n mkdir -p "$DEPLOY_ETC/systemd/system/prime-compositor.service.d"
          cat <<'EOF' | sudo -n tee "$DEPLOY_ETC/systemd/system/prime-compositor.service.d/10-clean-launch-proof.conf" >/dev/null
          [Service]
          ExecStart=
          ExecStart=/usr/bin/env XDG_RUNTIME_DIR=/run/prime-compositor /usr/libexec/prime/prime-compositor
          EOF
          sudo -n sync
          echo CLEAN_LAUNCH_DROPIN_BEGIN
          sudo -n cat "$DEPLOY_ETC/systemd/system/prime-compositor.service.d/10-clean-launch-proof.conf"
          echo CLEAN_LAUNCH_DROPIN_END
          cleanup
          cp "$OVMF_VARS_TEMPLATE" "$STATE/vars.fd"

      - name: Boot exact corrected EFI path
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 135s qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -smp 2 -m 3072 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$STATE/vars.fd" \
            -drive file="$STATE/proof.qcow2",if=virtio,format=qcow2 \
            -display none -serial "file:$STATE/serial.log" -monitor none -net none -no-reboot
          RC=$?
          set -e
          test "$RC" -eq 0 -o "$RC" -eq 124 -o "$RC" -eq 143
          echo CLEAN_LAUNCH_SERIAL_BEGIN
          grep -E -i 'primed: host=|prime-compositor initialized output|prime-shell|SHELL_READY|Error: PermissionDenied|Main process exited|Failed with result' "$STATE/serial.log" | tail -n 1200 || true
          echo CLEAN_LAUNCH_SERIAL_END
          ! grep -q 'Error: PermissionDenied' "$STATE/serial.log"

      - name: Prove persisted mechanical readiness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo -n umount "$STATE/replay-root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          mkdir -p "$STATE/replay-root"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$STATE/proof.qcow2")" "$STATE/replay.qcow2"
          sudo -n qemu-nbd --connect="$NBD" "$STATE/replay.qcow2"
          sleep 2; sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          set +e; sudo -n e2fsck -fy "$ROOT"; FSCK_RC=$?; set -e
          test $((FSCK_RC & 12)) -eq 0
          sudo -n mount -o ro "$ROOT" "$STATE/replay-root"
          PRIME="$STATE/replay-root/state/os/default/var/lib/prime"
          MECH="$PRIME/first-light/mechanical.json"
          GEN="$PRIME/generations/current.json"
          sudo -n test -f "$GEN"
          sudo -n test -f "$MECH"
          echo CLEAN_LAUNCH_GENERATION_BEGIN
          sudo -n cat "$GEN"
          echo CLEAN_LAUNCH_GENERATION_END
          echo CLEAN_LAUNCH_MECHANICAL_BEGIN
          sudo -n cat "$MECH"
          echo CLEAN_LAUNCH_MECHANICAL_END
          sudo -n python3 - "$GEN" "$MECH" <<'PY'
          import json,sys
          g=json.load(open(sys.argv[1]))
          d=json.load(open(sys.argv[2]))
          assert g['state'] == 'HEALTH_PROVING', g
          refs=set(g.get('evidence_refs', []))
          assert 'bootc.status.v1' in refs, refs
          assert 'prime.core.socket.bound.v1' in refs, refs
          assert d.get('schema') == 'prime.first-light-mechanical.v1', d
          assert d.get('status') == 'SHELL_READY', d
          assert d.get('shell_ready') is True, d
          assert d.get('frame_loop_ready') is True, d
          assert d.get('wayland_listener_ready') is True, d
          assert int(d.get('clients_accepted', 0)) >= 1, d
          assert int(d.get('mapped_surface_frames_submitted', 0)) >= 1, d
          assert int(d.get('core_socket_gid', 0)) != 0, d
          print('GATE_1_CORE=PASS')
          print('GATE_2_COMPOSITOR_SESSION=PASS')
          print('GATE_3_SHELL_READY=PASS')
          print('CLEAN_PRODUCT_FORM_LAUNCH=PASS')
          PY
