name: Construction Smithay Fedora

# Temporary construction adapter. This is not Prime proof authority and must be
# removed before the P1 candidate is frozen for merge.
on:
  pull_request:
    branches:
      - build/p1-first-light
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compile:
    if: ${{ startsWith(github.head_ref, 'construction/p1-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIME_CONSTRUCTION_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIME_CONSTRUCTION_SHA }}
          fetch-depth: 0
      - name: Freeze construction candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIME_CONSTRUCTION_SHA"
          test -f construction/prove-smithay-fedora44.sh
          printf 'PRIME_SMITHAY_CONSTRUCTION_SHA=%s\n' "$PRIME_CONSTRUCTION_SHA"
      - name: Regenerate mechanical Rust metadata with exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add rustfmt --toolchain 1.97.1
          test "$(rustc +1.97.1 --version | cut -d ' ' -f2)" = '1.97.1'
          cargo +1.97.1 generate-lockfile
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 fmt --all
          if ! git diff --quiet -- Cargo.lock '*.rs'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git add -- '*.rs'
            git commit -m 'construction: apply pinned Rust mechanical formatting'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
          printf 'PRIME_CONSTRUCTION_LOCK_SHA256=%s\n' "$(sha256sum Cargo.lock | cut -d ' ' -f1)"
      - name: Apply mechanical image preparation when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f construction/prepare-image.py; then
            python3 construction/prepare-image.py
            git diff --check
            if ! git diff --quiet -- image/Containerfile; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add image/Containerfile
              git commit -m 'construction: apply renderer runtime image closure'
              git push origin HEAD:"$GITHUB_HEAD_REF"
            fi
          fi
      - name: Apply mechanical proof preparation when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f construction/prepare-proof.py; then
            python3 construction/prepare-proof.py
            git diff --check
            if ! git diff --quiet -- tools/prove-p1-local.sh; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add tools/prove-p1-local.sh
              git commit -m 'construction: close compositor proof assertions'
              git push origin HEAD:"$GITHUB_HEAD_REF"
            fi
          fi
      - name: Compile locked Smithay graph on pinned Fedora 44
        shell: bash
        run: |
          set -euo pipefail
          chmod +x construction/prove-smithay-fedora44.sh
          construction/prove-smithay-fedora44.sh
