name: Prime P1 Lint Cleanup Repair

on:
  pull_request:
    branches:
      - build/p1-first-light
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'proof/p1-first-light-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove transient UKI inspection files before bootc lint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/prove-p1-local.sh')
          s = p.read_text()
          anchor = "    python3 -c '\\''import json; n=json.load(open(\"/tmp/prime-normal-uki.json\")); r=json.load(open(\"/tmp/prime-recovery-uki.json\")); nc=n[\".cmdline\"][\"text\"]; rc=r[\".cmdline\"][\"text\"]; assert \"prime.recovery=1\" not in nc; assert \"systemd.unit=prime-recovery.target\" not in nc; assert \"prime.recovery=1\" in rc; assert \"systemd.unit=prime-recovery.target\" in rc; assert \"Prime OS P1 First Light\" in n[\".osrel\"][\"text\"]; assert \"Prime OS Recovery\" in r[\".osrel\"][\"text\"]'\\''\n"
          cleanup = "    rm -f /tmp/prime-normal-uki.json /tmp/prime-recovery-uki.json\n"
          if cleanup not in s:
              if anchor not in s:
                  raise SystemExit('UKI inspection cleanup anchor missing')
              s = s.replace(anchor, anchor + cleanup, 1)
          p.write_text(s)
          assert p.read_text().count(cleanup) == 1
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -Fx tools/prove-p1-local.sh
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add tools/prove-p1-local.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(p1): clean UKI inspection files before lint"
          git push origin HEAD:proof/p1-first-light-final
