name: Prime P1 Seal Repair

on:
  pull_request:
    branches:
      - build/p1-first-light
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'proof/p1-first-light-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply upstream pre-UKI Composefs sealing model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          containerfile = Path('image/Containerfile')
          c = containerfile.read_text()

          split_anchor = '''FROM rootfs AS split
          RUN set -eux; \\
              mkdir -p /kernel; \\
              bootc container split-kernel-and-rootfs --rootfs / --output /kernel; \\
              test "$(find /kernel -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

          FROM rootfs AS uki-tools
          '''
          split_replacement = '''FROM rootfs AS split
          RUN set -eux; \\
              mkdir -p /kernel; \\
              bootc container split-kernel-and-rootfs --rootfs / --output /kernel; \\
              test "$(find /kernel -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

          # This stage is the exact filesystem sealed by the UKIs. Kernel build
          # artifacts are kept only in `split` and are intentionally excluded from
          # the Composefs rootfs digest, matching bootc's documented sealing model.
          FROM split AS sealed-rootfs
          RUN set -eux; \\
              rm -rf /kernel; \\
              test ! -e /kernel; \\
              ! find /usr/lib/modules -type f \\( -name vmlinuz -o -name initramfs.img \\) -print -quit | grep -q .

          FROM rootfs AS uki-tools
          '''
          if split_anchor in c:
              c = c.replace(split_anchor, split_replacement, 1)
          elif 'FROM split AS sealed-rootfs' not in c:
              raise SystemExit('sealed-rootfs insertion anchor missing')

          old_mount = '--mount=type=bind,from=split,target=/target,ro \\\n'
          new_mount = '--mount=type=bind,from=sealed-rootfs,target=/target,ro \\\n'
          if old_mount in c:
              c = c.replace(old_mount, new_mount, 1)
          elif new_mount not in c:
              raise SystemExit('sealed-rootfs target mount anchor missing')

          if 'FROM split AS final' in c:
              c = c.replace('FROM split AS final', 'FROM sealed-rootfs AS final', 1)
          elif 'FROM sealed-rootfs AS final' not in c:
              raise SystemExit('final stage anchor missing')

          final_anchor = '''    test "$(find /boot/EFI/Linux -maxdepth 1 -type f -name '*.recovery.efi' | wc -l)" -eq 1; \\
              ! find /usr/lib/modules -type f \\( -name vmlinuz -o -name initramfs.img \\) -print -quit | grep -q .; \\
          '''
          final_replacement = '''    test "$(find /boot/EFI/Linux -maxdepth 1 -type f -name '*.recovery.efi' | wc -l)" -eq 1; \\
              test ! -e /kernel; \\
              ! find /usr/lib/modules -type f \\( -name vmlinuz -o -name initramfs.img \\) -print -quit | grep -q .; \\
          '''
          if final_anchor in c:
              c = c.replace(final_anchor, final_replacement, 1)
          elif '    test ! -e /kernel; \\\n' not in c:
              raise SystemExit('final /kernel assertion anchor missing')

          containerfile.write_text(c)

          proof = Path('tools/prove-p1-local.sh')
          p = proof.read_text()
          start = p.index('log "Build provisional Prime bootc image"')
          end = p.index('log "Inspect final Prime image and recovery contract"')
          replacement = r'''log "Build canonical sealed Prime rootfs"
          "${PODMAN[@]}" build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --target sealed-rootfs \
            --build-arg PRIME_BASE_IMAGE="$BASE_IMAGE" \
            --build-arg PRIME_BASE_DIGEST="$BASE_DIGEST" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$GENERATION_ID" \
            --build-arg PRIME_SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PRIME_CREATED_AT="$CREATED_AT" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            -f image/Containerfile \
            -t localhost/prime-os:p1-rootfs .

          log "Compute canonical OCI-storage Composefs digest from sealed rootfs"
          CANONICAL_DIGEST="$("${PODMAN[@]}" run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1-rootfs \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1-rootfs | tail -n1)"
          case "$CANONICAL_DIGEST" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) fail "invalid canonical Composefs digest: $CANONICAL_DIGEST" ;; esac
          printf 'sealed rootfs digest: %s\n' "$CANONICAL_DIGEST"

          log "Build Prime once with canonical normal and recovery UKI seals"
          "${PODMAN[@]}" build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --build-arg PRIME_BASE_IMAGE="$BASE_IMAGE" \
            --build-arg PRIME_BASE_DIGEST="$BASE_DIGEST" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$GENERATION_ID" \
            --build-arg PRIME_SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PRIME_CREATED_AT="$CREATED_AT" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            --build-arg PRIME_COMPOSEFS_DIGEST="$CANONICAL_DIGEST" \
            -f image/Containerfile \
            -t localhost/prime-os:p1 .

          log "Prove sealed-rootfs digest equals both embedded UKI digests"
          FINAL_DIGEST="$("${PODMAN[@]}" run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1 \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1 | tail -n1)"
          case "$FINAL_DIGEST" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) fail "invalid final image storage digest: $FINAL_DIGEST" ;; esac
          UKI_DIGESTS="$("${PODMAN[@]}" run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"
            recovery="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.recovery.efi" -print -quit)"
            test -n "$normal"
            test -n "$recovery"
            test "$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" | wc -l)" -eq 1
            test "$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.recovery.efi" | wc -l)" -eq 1
            grep -aoE "composefs=[0-9a-f]{128}" "$normal" | head -n1 | cut -d= -f2
            grep -aoE "composefs=[0-9a-f]{128}" "$recovery" | head -n1 | cut -d= -f2
          ')"
          NORMAL_EMBEDDED_DIGEST="$(printf '%s\n' "$UKI_DIGESTS" | sed -n '1p')"
          RECOVERY_EMBEDDED_DIGEST="$(printf '%s\n' "$UKI_DIGESTS" | sed -n '2p')"
          [[ -n "$NORMAL_EMBEDDED_DIGEST" ]] || fail "normal UKI Composefs digest missing"
          [[ -n "$RECOVERY_EMBEDDED_DIGEST" ]] || fail "recovery UKI Composefs digest missing"
          [[ "$NORMAL_EMBEDDED_DIGEST" == "$CANONICAL_DIGEST" ]] || fail "normal UKI Composefs digest does not match sealed rootfs digest"
          [[ "$RECOVERY_EMBEDDED_DIGEST" == "$CANONICAL_DIGEST" ]] || fail "recovery UKI Composefs digest does not match sealed rootfs digest"
          printf 'sealed rootfs digest: %s\nfinal image digest:   %s\nnormal UKI digest:    %s\nrecovery UKI digest:  %s\n' "$CANONICAL_DIGEST" "$FINAL_DIGEST" "$NORMAL_EMBEDDED_DIGEST" "$RECOVERY_EMBEDDED_DIGEST"

          '''
          p = p[:start] + replacement + p[end:]
          inspect_anchor = '    test -f /usr/lib/systemd/system/prime-recovery.target\n'
          if inspect_anchor in p and '    test ! -e /kernel\n' not in p:
              p = p.replace(inspect_anchor, inspect_anchor + '    test ! -e /kernel\n', 1)
          proof.write_text(p)

          # Mechanical Review fence.
          c2 = containerfile.read_text()
          p2 = proof.read_text()
          assert c2.count('FROM split AS sealed-rootfs') == 1
          assert c2.count('FROM sealed-rootfs AS final') == 1
          assert c2.count('from=sealed-rootfs,target=/target,ro') == 1
          assert 'FROM split AS final' not in c2
          assert 'final storage digest changed after reseal' not in p2
          assert p2.count('--target sealed-rootfs') == 1
          assert p2.count('localhost/prime-os:p1-rootfs') >= 3
          assert p2.count('normal UKI Composefs digest does not match sealed rootfs digest') == 1
          assert p2.count('recovery UKI Composefs digest does not match sealed rootfs digest') == 1
          PY

      - name: Freeze and publish repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx image/Containerfile
          printf '%s\n' "${changed[@]}" | grep -Fx tools/prove-p1-local.sh
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add image/Containerfile tools/prove-p1-local.sh
          if git diff --cached --quiet; then
            echo "seal candidate already repaired"
            exit 0
          fi
          git commit -m "fix(p1): seal pre-UKI rootfs digest"
          git push origin HEAD:proof/p1-first-light-final
