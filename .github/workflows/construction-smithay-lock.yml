name: Construction Smithay Lock

# Construction machinery only. This workflow may resolve and compile the
# dependency graph, but it is not a Prime proof/acceptance authority.
on:
  push:
    branches:
      - construction/p1-smithay-lock

permissions:
  contents: write

env:
  PRIME_BASE_IMAGE: quay.io/fedora/fedora-bootc:44-x86_64@sha256:130e3ea9633a00381ba8ea9b168fd04a4f90161eaa38af23c9eb927a0f1e5074

jobs:
  resolve:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify locked graph and feature boundary
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version --verbose
          cargo +1.97.1 --version
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 tree -p prime-compositor -e features | tee /tmp/smithay-features.txt
          cmp /tmp/smithay-features.txt construction/smithay-features.txt
          test "$(sha256sum Cargo.lock | awk '{print $1}')" = "$(awk -F= '/^cargo_lock_sha256=/{print $2}' construction/smithay-lock-report.txt)"
          for required in \
            backend_drm \
            backend_gbm \
            backend_libinput \
            backend_udev \
            backend_session_libseat \
            desktop \
            renderer_gl \
            wayland_frontend; do
            grep -F "smithay feature \"${required}\"" construction/smithay-features.txt >/dev/null
          done
          for forbidden in \
            backend_winit \
            backend_x11 \
            xwayland \
            backend_vulkan \
            renderer_pixman \
            renderer_multi; do
            ! grep -F "smithay feature \"${forbidden}\"" construction/smithay-features.txt >/dev/null
          done
      - name: Compile on pinned Fedora 44 substrate
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PRIME_BASE_IMAGE"
          docker run --rm \
            -e CARGO_TERM_COLOR=never \
            -v "$PWD:/work" \
            -w /work \
            "$PRIME_BASE_IMAGE" \
            bash -ceu '
              dnf -y install \
                ca-certificates \
                curl \
                gcc \
                gcc-c++ \
                make \
                pkgconf-pkg-config \
                "pkgconfig(libinput)" \
                "pkgconfig(libudev)" \
                "pkgconfig(gbm)" \
                "pkgconfig(libseat)" \
                "pkgconfig(xkbcommon)" \
                "pkgconfig(wayland-server)" \
                "pkgconfig(egl)" \
                "pkgconfig(glesv2)" \
                "pkgconfig(libdrm)"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1
              . "$HOME/.cargo/env"
              test "$(rustc --version | awk "{print \\$2}")" = "1.97.1"
              cargo metadata --locked --no-deps --format-version 1 >/dev/null
              cargo build --locked -p prime-compositor
              mkdir -p construction
              {
                echo "schema=prime.construction-smithay-fedora44-build.v1"
                echo "source_revision=${GITHUB_SHA:-unknown}"
                echo "substrate=$(cat /usr/lib/os-release | tr "\n" ";")"
                echo "rustc=$(rustc --version)"
                echo "cargo=$(cargo --version)"
                echo "cargo_lock_sha256=$(sha256sum Cargo.lock | awk "{print \\$1}")"
                echo "smithay_version=0.7.0"
                for capability in \
                  "pkgconfig(libinput)" \
                  "pkgconfig(libudev)" \
                  "pkgconfig(gbm)" \
                  "pkgconfig(libseat)" \
                  "pkgconfig(xkbcommon)" \
                  "pkgconfig(wayland-server)" \
                  "pkgconfig(egl)" \
                  "pkgconfig(glesv2)" \
                  "pkgconfig(libdrm)"; do
                  printf "%s=" "$capability"
                  rpm -q --whatprovides "$capability" --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n" | paste -sd, -
                done
              } > construction/smithay-fedora44-build.txt
            '
          sudo chown "$(id -u):$(id -g)" construction/smithay-fedora44-build.txt
      - name: Commit Fedora build evidence to construction branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add construction/smithay-fedora44-build.txt
          git diff --cached --quiet && { echo 'no Fedora build evidence produced' >&2; exit 1; }
          git commit -m 'construction: prove Smithay graph on pinned Fedora 44'
          git push origin HEAD:construction/p1-smithay-lock
