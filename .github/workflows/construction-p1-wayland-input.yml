name: Construction P1 Wayland Input

on:
  pull_request:
    branches:
      - construction/p1-input-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  packages: read

jobs:
  compile:
    if: ${{ github.head_ref == 'construction/p1-wayland-input' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIME_EVENT_SHA: ${{ github.event.pull_request.head.sha }}
      PRIME_HEAD_REF: ${{ github.head_ref }}
      PRIME_BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
      INPUT_HASH: 97c26a957242b5183d8715eb494e28155a87a849
      MAIN_HASH: 4def083eb6732eaa64ebfbfd1cfff9189d8a1d4d
      PROTOCOLS_HASH: d21fcceafb4c57f8073552b0393dd8ed54ad917b
      READINESS_HASH: 07f69216395e68144e7d9c76277afe3da32131bb
      INPUT_CONTRACT_HASH: ce978e22c91d7a110245a7fe3ac0f7784ca14607
      BASE_MAIN_HASH: e64d70f758552987150016b4650b7d8ab29a2d93
      BASE_READINESS_HASH: b329361dda4857d7c53cedd0326d86e5f3057259
      PATCH_HASH: 1752744b92140c53d0da5a0f5d7c87d6de6d922e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIME_EVENT_SHA }}
          fetch-depth: 0
      - name: Freeze event candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIME_EVENT_SHA"
      - name: Reconcile exact Tenfold candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object construction/input-main-readiness.patch)" = "$PATCH_HASH"
          test "$(git hash-object crates/prime-compositor/src/input.rs)" = "$INPUT_HASH"
          test "$(git hash-object crates/prime-compositor/src/protocols.rs)" = "$PROTOCOLS_HASH"
          test "$(git hash-object docs/contracts/PRIME_P1_WAYLAND_INPUT_V1.md)" = "$INPUT_CONTRACT_HASH"
          main_hash="$(git hash-object crates/prime-compositor/src/main.rs)"
          readiness_hash="$(git hash-object docs/contracts/PRIME_COMPOSITOR_READINESS_V1.md)"
          if [[ "$main_hash" != "$MAIN_HASH" || "$readiness_hash" != "$READINESS_HASH" ]]; then
            test "$main_hash" = "$BASE_MAIN_HASH"
            test "$readiness_hash" = "$BASE_READINESS_HASH"
            git apply --check construction/input-main-readiness.patch
            git apply construction/input-main-readiness.patch
          fi
          test "$(git hash-object crates/prime-compositor/src/main.rs)" = "$MAIN_HASH"
          test "$(git hash-object docs/contracts/PRIME_COMPOSITOR_READINESS_V1.md)" = "$READINESS_HASH"
          git diff --check
      - name: Login to Prime-owned GHCR substrate
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Compile exact candidate on Prime-owned Fedora mirror
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PRIME_BASE_IMAGE"
          test "$(docker image inspect "$PRIME_BASE_IMAGE" --format '{{.Id}}')" = 'sha256:c5231d09e81d63ffd7a25e25895169b93e21193ef63eae0500ac55317a2b8acb'
          docker run --rm \
            -e RUSTUP_HOME=/tmp/prime-rustup \
            -e CARGO_HOME=/tmp/prime-cargo \
            -v "$PWD:/work" \
            -w /work \
            "$PRIME_BASE_IMAGE" \
            bash -ceu '
              dnf -y install \
                ca-certificates curl gcc gcc-c++ make pkgconf-pkg-config \
                "pkgconfig(libinput)" "pkgconfig(libudev)" \
                mesa-libgbm-devel-26.1.7-1.fc44 \
                mesa-dri-drivers-26.1.7-1.fc44 \
                mesa-libEGL-26.1.7-1.fc44 \
                mesa-libgbm-26.1.7-1.fc44 \
                "pkgconfig(libseat)" "pkgconfig(xkbcommon)" \
                "pkgconfig(wayland-server)" "pkgconfig(egl)" \
                "pkgconfig(glesv2)" "pkgconfig(libdrm)"
              rm -rf "$RUSTUP_HOME" "$CARGO_HOME"
              mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                -y --profile minimal --default-toolchain 1.97.1 --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup component add rustfmt clippy --toolchain 1.97.1
              cargo metadata --locked --no-deps --format-version 1 >/dev/null
              cargo fmt --all -- --check
              cargo clippy --locked -p prime-compositor --all-targets -- -D warnings
              cargo build --locked -p prime-compositor --release --bin prime-compositor
              ! ldd target/release/prime-compositor | grep -q "not found"
              target/release/prime-compositor --help
              echo PRIME_WAYLAND_INPUT_BUILD=PASS
            '
