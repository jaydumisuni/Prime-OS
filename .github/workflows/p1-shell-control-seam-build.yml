name: P1 Shell Control Seam Build

# synchronize adapter-base PR
on:
  push:
    branches:
      - build/p1-shell-principal-20260822
  pull_request:
    branches:
      - build/p1-first-light

permissions:
  contents: write

concurrency:
  group: p1-shell-control-seam-build-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-review-freeze:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Recover exact construction parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 872b46658863ba0694bd0de017e1a8491047ffa2 HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" = "build/p1-shell-principal-20260822"

      - name: Correct construction helper literals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-p1-shell-control-seam.py')
          s=p.read_text()
          old='Socket possession alone is execution authorization.'
          new='Socket possession alone is not execution authorization.'
          if old not in s:
              raise SystemExit('construction helper correction target missing')
          s=s.replace(old,new)
          old_helper='''    if text.count(old) != 1:\n        raise SystemExit(f"{path}: expected exactly one replacement target, got {text.count(old)}")\n    p.write_text(text.replace(old, new, 1))\n'''
          new_helper='''    count = text.count(old)\n    two_stage_target = (\n        path == "image/Containerfile"\n        and old == "    test -f /usr/lib/systemd/system/prime-recovery.target; \\\\\\n"\n    )\n    expected = 2 if two_stage_target else 1\n    if count != expected:\n        raise SystemExit(\n            f"{path}: expected exactly {expected} replacement target(s), got {count}"\n        )\n    p.write_text(text.replace(old, new, expected))\n'''
          if old_helper not in s:
              raise SystemExit('replace_once helper target missing')
          p.write_text(s.replace(old_helper,new_helper,1))
          PY

      - name: Build P1 Shell control seam
        run: python3 tools/apply-p1-shell-control-seam.py

      - name: Static review gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'pub source_path: Option<String>' crates/prime-contracts/src/application.rs
          grep -F 'GET /v1/applications' docs/contracts/PRIME_CAPABILITY_INTERFACE_V1.md
          grep -F 'prime-shell' image/sysusers/prime-shell.conf
          grep -F 'chown(socket_path, None, Some(shell_gid))?' crates/primed/src/server.rs
          grep -F 'if !native_launch_authorized(peer_uid, peer_gid, shell_gid)' crates/primed/src/server.rs
          grep -F 'if peer_uid != 0' crates/primed/src/server.rs >/dev/null
          test "$(grep -Fc 'Prime Shell service principal' image/Containerfile)" -eq 2

      - name: Install frozen Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          test "$(rustc --version | cut -d' ' -f2)" = "1.97.1"

      - name: Prove exact code
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p prime-contracts -p primed
          cargo clippy --locked -p prime-contracts -p primed --all-targets -- -D warnings

      - name: Freeze product-only milestone
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-p1-shell-control-seam.py .github/workflows/p1-shell-control-seam-build.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | sort
          git commit -m "feat(p1): establish bounded Prime Shell control seam"
          git push origin HEAD:build/p1-shell-principal-20260822

  pr-observer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Report construction state
        run: |
          set -euo pipefail
          git status --short
          test -f tools/apply-p1-shell-control-seam.py || true
