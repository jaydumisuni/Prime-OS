name: Prime P1 Resolve Fedora Tags

on:
  push:
    branches:
      - build/p1-first-light

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/p1-first-light
      - name: Resolve Fedora 44 bootc tags and digests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo jq
          mkdir -p image/evidence
          skopeo list-tags docker://quay.io/fedora/fedora-bootc > /tmp/tags.json
          jq -r '.Tags[]' /tmp/tags.json | grep -E '(^44$|^44[._-]|[._-]44([._-]|$))' | sort -V > /tmp/f44-tags.txt
          {
            echo '# Active Fedora bootc tags matching Fedora 44'
            cat /tmp/f44-tags.txt
            echo
            echo '# Resolved digests'
            while IFS= read -r tag; do
              test -n "$tag" || continue
              digest="$(skopeo inspect --format '{{.Digest}}' "docker://quay.io/fedora/fedora-bootc:${tag}" 2>/dev/null || true)"
              printf '%s %s\n' "$tag" "$digest"
            done < /tmp/f44-tags.txt
          } > image/evidence/fedora44-active-tags.txt
          test -s image/evidence/fedora44-active-tags.txt
          cat image/evidence/fedora44-active-tags.txt
      - name: Commit resolver evidence only
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':(exclude)image/evidence/fedora44-active-tags.txt'; then
            echo 'Resolver changed an unexpected path.'
            git status --short
            exit 1
          fi
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add image/evidence/fedora44-active-tags.txt
          git commit -m 'evidence: record active Fedora 44 bootc tags'
          git push origin HEAD:build/p1-first-light
