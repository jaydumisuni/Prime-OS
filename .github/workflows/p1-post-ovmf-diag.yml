name: Prime P1 SATA guest causality proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: read

jobs:
  sata-causality:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 6
    env:
      EXPECTED_CANDIDATE: 0398835ff01c9139be1c32f41530e4d1af12175b
      RUN_DIR: /var/tmp/prime-p1-local-proof/run
      DISK: /var/tmp/prime-p1-local-proof/run/output/bootc-prime-0.1-qcow2-x86_64.qcow2
      TEST_OVERLAY: /var/tmp/prime-p1-local-proof/run/prime-p1-sata-diag-overlay.qcow2
      TEST_SERIAL: /var/tmp/prime-p1-local-proof/run/prime-p1-sata-diag-serial.log
      TEST_VARS: /var/tmp/prime-p1-local-proof/run/OVMF_VARS_4M-sata-diag.fd
      NBD: /dev/nbd1
      MNT: /var/tmp/prime-p1-sata-diag-mnt
    steps:
      - name: Boot exact QCOW2 through non-virtio SATA transport
        shell: bash
        run: |
          set -euo pipefail
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -f "$DISK"
          test -r "$OVMF_CODE"
          test -r "$OVMF_VARS_TEMPLATE"
          echo "CANDIDATE_EXPECTED=$EXPECTED_CANDIDATE"
          echo "DISK=$DISK"

          cleanup() {
            sudo -n umount "$MNT" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$MNT"
          mkdir -p "$MNT"
          rm -f "$TEST_OVERLAY" "$TEST_SERIAL" "$TEST_VARS"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$DISK")" "$TEST_OVERLAY"
          cp "$OVMF_VARS_TEMPLATE" "$TEST_VARS"

          echo SATA_QEMU_BEGIN
          set +e
          timeout --signal=TERM 120s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$TEST_VARS" \
            -device ich9-ahci,id=ahci \
            -drive file="$TEST_OVERLAY",if=none,format=qcow2,id=prime-disk \
            -device ide-hd,drive=prime-disk,bus=ahci.0 \
            -display none \
            -serial "file:$TEST_SERIAL" \
            -monitor none \
            -net none \
            -no-reboot
          QEMU_RC=$?
          set -e
          echo "SATA_QEMU_RC=$QEMU_RC"
          echo SATA_QEMU_END
          test "$QEMU_RC" -eq 0 -o "$QEMU_RC" -eq 124 -o "$QEMU_RC" -eq 143
          echo "SATA_SERIAL_BYTES=$(wc -c < "$TEST_SERIAL" 2>/dev/null || echo 0)"
          echo SATA_SERIAL_BEGIN
          cat "$TEST_SERIAL" 2>/dev/null || true
          echo SATA_SERIAL_END

          cleanup
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --read-only --connect="$NBD" "$TEST_OVERLAY"
          sleep 2
          sudo -n partprobe "$NBD"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ROOT"
          echo "SATA_ROOT=$ROOT"
          sudo -n mount -o ro "$ROOT" "$MNT"

          FOUND=0
          for p in "$MNT/state/os/default/var/lib/prime" "$MNT/var/lib/prime"; do
            rel="${p#$MNT}"
            if sudo -n test -f "$p/hardware/current.json"; then
              FOUND=1
              echo "SATA_PRIME_STATE_PATH=$rel"
              sudo -n find "$p" -maxdepth 3 -type f -printf 'SATA_PRIME_FILE=%P\n' | sort | head -n 80 || true
              if sudo -n test -f "$p/generations/current.json"; then
                printf 'SATA_GENERATION='; sudo -n cat "$p/generations/current.json"; printf '\n'
              fi
              if sudo -n test -f "$p/first-light/mechanical.json"; then
                printf 'SATA_FIRST_LIGHT='; sudo -n cat "$p/first-light/mechanical.json"; printf '\n'
              fi
            fi
          done
          echo "SATA_PRIME_STATE=$FOUND"
          test "$FOUND" -eq 1
          echo SATA_CAUSALITY_PROOF=PASS
