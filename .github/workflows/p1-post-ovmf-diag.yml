name: Prime P1 compact guest boot evidence

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 10
    env:
      EXPECTED_CANDIDATE: 0398835ff01c9139be1c32f41530e4d1af12175b
      RUN_DIR: /var/tmp/prime-p1-local-proof/run
      OVERLAY: /var/tmp/prime-p1-local-proof/run/prime-p1-boot-overlay.qcow2
      SERIAL: /var/tmp/prime-p1-local-proof/run/prime-serial.log
      NBD: /dev/nbd1
      MNT: /var/tmp/prime-p1-compact-guest-diag
    steps:
      - name: Emit decisive preserved-guest markers
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OVERLAY"
          echo "CANDIDATE_EXPECTED=$EXPECTED_CANDIDATE"
          echo "OVERLAY=$OVERLAY"
          qemu-img info "$OVERLAY" | grep -E '^(file format|virtual size|backing file|backing file format):' || true

          if test -f "$SERIAL"; then
            echo "SERIAL_BYTES=$(wc -c < "$SERIAL")"
            echo 'SERIAL_MARKERS_BEGIN'
            grep -E -i 'error|failed|failure|panic|VFS|dracut|emergency|root|composefs|bootc|initrd|mount|systemd|virtio' "$SERIAL" | head -n 80 || true
            echo 'SERIAL_MARKERS_END'
          else
            echo 'SERIAL_MISSING=1'
          fi

          cleanup() {
            sudo -n umount "$MNT/esp" >/dev/null 2>&1 || true
            sudo -n umount "$MNT/boot" >/dev/null 2>&1 || true
            sudo -n umount "$MNT/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$MNT"
          mkdir -p "$MNT/esp" "$MNT/boot" "$MNT/root"
          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --read-only --connect="$NBD" "$OVERLAY"
          sleep 2
          sudo -n partprobe "$NBD"

          ESP="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1; exit}')"
          XBOOT="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="bc13c2ff-59e6-4262-a352-b275fd6f7172" {print $1; exit}')"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ESP"
          test -n "$ROOT"
          echo "ESP=$ESP"
          echo "XBOOT=${XBOOT:-NONE}"
          echo "ROOT=$ROOT"
          lsblk -no NAME,FSTYPE,LABEL,UUID,PARTLABEL "$ROOT" | sed 's/^/ROOT_IDENTITY=/'

          sudo -n mount -o ro "$ESP" "$MNT/esp"
          test -z "$XBOOT" || sudo -n mount -o ro "$XBOOT" "$MNT/boot"
          sudo -n mount -o ro "$ROOT" "$MNT/root"

          echo 'BLS_BEGIN'
          for root in "$MNT/esp" "$MNT/boot"; do
            for f in "$root"/loader/entries/*.conf; do
              sudo -n test -f "$f" || continue
              printf 'BLS_FILE=%s\n' "${f#$MNT/}"
              sudo -n grep -E '^(title|version|efi|linux|options|sort-key)' "$f" || true
            done
          done
          echo 'BLS_END'

          UKI="$(sudo -n find "$MNT/esp/EFI/Linux/bootc" "$MNT/boot/EFI/Linux/bootc" -maxdepth 1 -type f -name '*.efi' -print 2>/dev/null | head -n1)"
          test -n "$UKI"
          COPY="$RUN_DIR/compact-normal.efi"
          INITRD="$RUN_DIR/compact-normal.initrd"
          LISTING="$RUN_DIR/compact-normal.lsinitrd"
          sudo -n cp "$UKI" "$COPY"
          sudo -n chown "$(id -u):$(id -g)" "$COPY"
          echo "NORMAL_UKI=${UKI#$MNT/}"
          echo "NORMAL_UKI_SHA256=$(sha256sum "$COPY" | awk '{print $1}')"

          if command -v objcopy >/dev/null 2>&1; then
            rm -f "$RUN_DIR/compact-normal.cmdline" "$INITRD"
            objcopy --dump-section .cmdline="$RUN_DIR/compact-normal.cmdline" "$COPY"
            objcopy --dump-section .initrd="$INITRD" "$COPY"
            printf 'CMDLINE='
            tr -d '\000' < "$RUN_DIR/compact-normal.cmdline"
            printf '\n'
            echo "INITRD_BYTES=$(wc -c < "$INITRD")"
          else
            echo OBJCOPY_MISSING=1
          fi

          : > "$LISTING"
          if test -s "$INITRD" && command -v lsinitrd >/dev/null 2>&1; then
            lsinitrd "$INITRD" > "$LISTING" 2>&1 || true
          elif test -s "$INITRD"; then
            strings -a "$INITRD" > "$LISTING" || true
          fi

          for token in 'bootc' 'composefs' 'ostree' 'systemd' 'virtio_blk' 'virtio_pci' 'ext4' 'systemd-veritysetup' 'rootfs'; do
            key="$(printf '%s' "$token" | tr '[:lower:]-' '[:upper:]_')"
            if grep -E -i -q "$token" "$LISTING"; then
              echo "INITRD_HAS_${key}=1"
            else
              echo "INITRD_HAS_${key}=0"
            fi
          done
          echo 'INITRD_ROOT_MARKERS_BEGIN'
          grep -E -i 'bootc|composefs|ostree|rootfs|sysroot|verity|virtio(_|-)(blk|pci)|ext4' "$LISTING" | head -n 80 || true
          echo 'INITRD_ROOT_MARKERS_END'

          for p in "$MNT/root/state/os/default/var/lib/prime" "$MNT/root/var/lib/prime"; do
            rel="${p#$MNT/root}"
            if sudo -n test -e "$p"; then
              echo "PRIME_STATE_EXISTS[$rel]=1"
              sudo -n find "$p" -maxdepth 3 -type f -printf 'PRIME_FILE=%P\n' | sort | head -n 40 || true
            else
              echo "PRIME_STATE_EXISTS[$rel]=0"
            fi
          done

          echo 'ROOT_BOOT_LAYOUT_BEGIN'
          sudo -n find "$MNT/root" -maxdepth 4 \( -path '*/bootc*' -o -path '*/ostree*' -o -path '*/state/os/default*' \) -printf '%y %P -> %l\n' | sort | head -n 80 || true
          echo 'ROOT_BOOT_LAYOUT_END'
          echo COMPACT_GUEST_BOOT_EVIDENCE=PASS
