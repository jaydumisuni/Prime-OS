name: Prime P1 Disk UEFI Rehearsal

on:
  push:
    branches:
      - build/p1-first-light

permissions:
  contents: read

jobs:
  disk-uefi:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6

      - name: Install disk and UEFI proof tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            podman skopeo fuse-overlayfs qemu-utils qemu-system-x86 ovmf gdisk util-linux
          sudo modprobe fuse || true
          test -e /dev/fuse

      - name: Assert pinned builder platform
        id: builder
        shell: bash
        run: |
          set -euo pipefail
          ref="$(python3 -c 'import json; print(json.load(open("image/image-builder.lock.json"))["pinned_reference"])')"
          digest="$(python3 -c 'import json; print(json.load(open("image/image-builder.lock.json"))["manifest_digest"])')"
          version="$(python3 -c 'import json; print(json.load(open("image/image-builder.lock.json"))["version"])')"
          inspect="$(skopeo inspect --override-os linux --override-arch amd64 --format '{{.Digest}} {{.Os}} {{.Architecture}}' "docker://${ref}")"
          test "$inspect" = "$digest linux amd64"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Assert Rust toolchain identity and build Prime Core
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked --release -p primed
          test -x target/release/primed

      - name: Build provisional Prime image in rootful storage
        id: prime
        shell: bash
        run: |
          set -euo pipefail
          base_image="$(python3 -c 'import json; print(json.load(open("image/fedora-base.lock.json"))["pinned_reference"])')"
          base_digest="$(python3 -c 'import json; print(json.load(open("image/fedora-base.lock.json"))["manifest_digest"])')"
          source_revision="$(git rev-parse HEAD)"
          created_at="$(git show -s --format=%cI HEAD)"
          generation_id="p1-first-light-${source_revision:0:12}"
          sudo podman pull "$base_image"
          sudo podman build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --build-arg PRIME_BASE_IMAGE="$base_image" \
            --build-arg PRIME_BASE_DIGEST="$base_digest" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$generation_id" \
            --build-arg PRIME_SOURCE_REVISION="$source_revision" \
            --build-arg PRIME_CREATED_AT="$created_at" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            -f image/Containerfile \
            -t localhost/prime-os:p1-provisional .
          printf 'source_revision=%s\n' "$source_revision" >> "$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
          printf 'generation_id=%s\n' "$generation_id" >> "$GITHUB_OUTPUT"
          printf 'base_image=%s\n' "$base_image" >> "$GITHUB_OUTPUT"
          printf 'base_digest=%s\n' "$base_digest" >> "$GITHUB_OUTPUT"

      - name: Compute provisional canonical storage digest
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1-provisional \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1-provisional | tail -n1)"
          case "$digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) echo "invalid canonical digest: $digest" >&2; exit 1 ;; esac
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'provisional canonical storage digest: %s\n' "$digest"

      - name: Rebuild Prime with canonical UKI seal
        shell: bash
        env:
          PRIME_BASE_IMAGE: ${{ steps.prime.outputs.base_image }}
          PRIME_BASE_DIGEST: ${{ steps.prime.outputs.base_digest }}
          PRIME_COMPOSEFS_DIGEST: ${{ steps.canonical.outputs.digest }}
          SOURCE_REVISION: ${{ steps.prime.outputs.source_revision }}
          CREATED_AT: ${{ steps.prime.outputs.created_at }}
          GENERATION_ID: ${{ steps.prime.outputs.generation_id }}
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --build-arg PRIME_BASE_IMAGE="$PRIME_BASE_IMAGE" \
            --build-arg PRIME_BASE_DIGEST="$PRIME_BASE_DIGEST" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$GENERATION_ID" \
            --build-arg PRIME_SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PRIME_CREATED_AT="$CREATED_AT" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            --build-arg PRIME_COMPOSEFS_DIGEST="$PRIME_COMPOSEFS_DIGEST" \
            -f image/Containerfile \
            -t localhost/prime-os:p1 .
          sudo podman image exists localhost/prime-os:p1
          sudo podman image inspect localhost/prime-os:p1 --format '{{.Id}} {{.Os}} {{.Architecture}}'

      - name: Prove final UKI and OCI storage share one seal
        id: seal
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.canonical.outputs.digest }}
        run: |
          set -euo pipefail
          final_digest="$(sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1 \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1 | tail -n1)"
          embedded_digest="$(sudo podman run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            uki="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" -print -quit)"
            test -n "$uki"
            grep -aoE "composefs=[0-9a-f]{128}" "$uki" | head -n1 | cut -d= -f2
          ')"
          case "$final_digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          case "$embedded_digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          printf 'provisional canonical digest: %s\n' "$EXPECTED_DIGEST"
          printf 'final canonical digest:       %s\n' "$final_digest"
          printf 'UKI embedded digest:          %s\n' "$embedded_digest"
          test "$final_digest" = "$EXPECTED_DIGEST"
          test "$embedded_digest" = "$EXPECTED_DIGEST"
          printf 'digest=%s\n' "$final_digest" >> "$GITHUB_OUTPUT"

      - name: Prove image-builder sees unified Prime image
        shell: bash
        env:
          BUILDER_REF: ${{ steps.builder.outputs.ref }}
        run: |
          set -euo pipefail
          sudo podman pull "$BUILDER_REF"
          sudo podman run --rm "$BUILDER_REF" version
          sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BUILDER_REF" \
            bootc inspect --ref localhost/prime-os:p1 --format json \
            > /tmp/prime-image-builder-inspect.json
          cat /tmp/prime-image-builder-inspect.json
          python3 -c 'import json; d=json.load(open("/tmp/prime-image-builder-inspect.json")); assert d["UnifiedKernel"] is True, d; assert d["Arch"] == "amd64", d; assert d["Bootloader"] == "systemd", d; osr=d["OSInfo"]["OSRelease"]; assert osr["ID"] == "fedora", d; assert osr["VersionID"] == "44", d'

      - name: Build Prime QCOW2 from local bootc image
        shell: bash
        env:
          BUILDER_REF: ${{ steps.builder.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output:/output" \
            "$BUILDER_REF" \
            --output-dir /output \
            build \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-default-fs ext4 \
            --with-manifest \
            --with-buildlog \
            --progress verbose \
            qcow2
          mapfile -t disks < <(find output -type f -name '*.qcow2' -print)
          test "${#disks[@]}" -eq 1
          qemu-img info "${disks[0]}"
          qemu-img check "${disks[0]}"
          printf '%s\n' "${disks[0]}" > /tmp/prime-disk-path

      - name: Inspect generated GPT and boot partitions
        shell: bash
        run: |
          set -euo pipefail
          disk="$(cat /tmp/prime-disk-path)"
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only --connect=/dev/nbd0 "$disk"
          cleanup() { sudo umount /mnt/prime-esp 2>/dev/null || true; sudo umount /mnt/prime-xbootldr 2>/dev/null || true; sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          sudo partprobe /dev/nbd0
          sudo sgdisk -p /dev/nbd0 | tee /tmp/prime-gpt.txt
          lsblk -b -o NAME,SIZE,TYPE,FSTYPE,PARTTYPE,PARTLABEL /dev/nbd0 | tee /tmp/prime-lsblk.txt
          esp="$(lsblk -nrpo NAME,PARTTYPE /dev/nbd0 | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1; exit}')"
          test -n "$esp"
          sudo mkdir -p /mnt/prime-esp
          sudo mount -o ro "$esp" /mnt/prime-esp
          find /mnt/prime-esp -maxdepth 5 -type f -printf '%P\n' | sort | tee /tmp/prime-esp-files.txt
          test -f /mnt/prime-esp/EFI/BOOT/BOOTX64.EFI || test -f /mnt/prime-esp/EFI/systemd/systemd-bootx64.efi
          xbootldr="$(lsblk -nrpo NAME,PARTTYPE /dev/nbd0 | awk 'tolower($2)=="bc13c2ff-59e6-4262-a352-b275fd6f7172" {print $1; exit}')"
          if test -n "$xbootldr"; then
            sudo mkdir -p /mnt/prime-xbootldr
            sudo mount -o ro "$xbootldr" /mnt/prime-xbootldr
            find /mnt/prime-xbootldr -maxdepth 5 -type f -printf '%P\n' | sort | tee /tmp/prime-xbootldr-files.txt
            find /mnt/prime-xbootldr -maxdepth 5 -type f -name '*.efi' -print -quit | grep -q .
          else
            find /mnt/prime-esp -maxdepth 5 -type f -name '*.efi' -print -quit | grep -q .
          fi

      - name: Boot Prime QCOW2 through UEFI under QEMU
        shell: bash
        run: |
          set -euo pipefail
          disk="$(realpath "$(cat /tmp/prime-disk-path)")"
          overlay=/tmp/prime-p1-boot-overlay.qcow2
          qemu-img create -f qcow2 -F qcow2 -b "$disk" "$overlay"
          if test -f /usr/share/OVMF/OVMF_CODE.fd; then
            ovmf=/usr/share/OVMF/OVMF_CODE.fd
          else
            ovmf="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE_4M.fd' -print | head -n1)"
          fi
          test -n "$ovmf"
          set +e
          timeout --signal=TERM 90s qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu max \
            -smp 2 \
            -m 3072 \
            -bios "$ovmf" \
            -drive file="$overlay",if=virtio,format=qcow2 \
            -display none \
            -serial file:/tmp/prime-serial.log \
            -monitor none \
            -net none \
            -no-reboot
          qemu_rc=$?
          set -e
          test "$qemu_rc" -eq 0 || test "$qemu_rc" -eq 124 || test "$qemu_rc" -eq 143
          cat /tmp/prime-serial.log || true

      - name: Prove Prime Core persisted Host state after UEFI boot
        shell: bash
        env:
          EXPECTED_GENERATION_ID: ${{ steps.prime.outputs.generation_id }}
        run: |
          set -euo pipefail
          overlay=/tmp/prime-p1-boot-overlay.qcow2
          sudo qemu-nbd --read-only --connect=/dev/nbd0 "$overlay"
          cleanup() { sudo umount /mnt/prime-root 2>/dev/null || true; sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 2
          sudo partprobe /dev/nbd0
          root_part="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE /dev/nbd0 | awk '$2=="part" && $3=="ext4" {print $4, $1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$root_part"
          sudo mkdir -p /mnt/prime-root
          sudo mount -o ro "$root_part" /mnt/prime-root
          prime_dir=''
          for candidate in \
            /mnt/prime-root/state/os/default/var/lib/prime \
            /mnt/prime-root/var/lib/prime; do
            if sudo test -f "$candidate/hardware/current.json"; then
              prime_dir="$candidate"
              break
            fi
          done
          test -n "$prime_dir"
          identity_file="$prime_dir/identity/host.json"
          hardware_file="$prime_dir/hardware/current.json"
          generation_file="$prime_dir/generations/current.json"
          sudo test -f "$identity_file"
          sudo test -f "$hardware_file"
          sudo test -f "$generation_file"
          sudo python3 -c 'import json,sys; h=json.load(open(sys.argv[1])); hw=json.load(open(sys.argv[2])); assert h["host_id"]; assert str(h["host_arch"]).lower() in ("x86_64","amd64"); assert hw' "$identity_file" "$hardware_file"
          sudo env EXPECTED_GENERATION_ID="$EXPECTED_GENERATION_ID" python3 -c 'import json,os,sys; g=json.load(open(sys.argv[1])); assert g["generation_id"] == os.environ["EXPECTED_GENERATION_ID"], g; assert g["state"] == "BOOT_TRY", g' "$generation_file"
          echo "Prime Host identity: $identity_file"
          echo "Prime generation state: $generation_file"
          echo "Prime hardware state: $hardware_file"
          test -s /tmp/prime-serial.log || echo 'Serial console was not required for Host-state proof.'

      - name: Record hosted disk proof summary
        if: always()
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.prime.outputs.source_revision }}
          GENERATION_ID: ${{ steps.prime.outputs.generation_id }}
          COMPOSEFS_DIGEST: ${{ steps.seal.outputs.digest }}
          BUILDER_VERSION: ${{ steps.builder.outputs.version }}
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
        run: |
          {
            echo '### Prime P1 hosted disk/UEFI rehearsal'
            echo "- source revision: \`$SOURCE_REVISION\`"
            echo "- generation: \`$GENERATION_ID\`"
            echo "- composefs storage digest: \`$COMPOSEFS_DIGEST\`"
            echo "- image-builder: \`$BUILDER_VERSION\` / \`$BUILDER_DIGEST\`"
            echo '- target: hosted QEMU/OVMF only; **not HP/Kratos physical proof**'
            if test -f /tmp/prime-gpt.txt; then
              echo '```text'
              cat /tmp/prime-gpt.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
