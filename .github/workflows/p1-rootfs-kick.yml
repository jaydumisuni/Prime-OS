name: Diagnose P1 Composefs reseal delta

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 20
    steps:
      - name: Diff bootc Composefs dumpfiles from persisted proof images
        shell: bash
        run: |
          set -euo pipefail
          sudo -n podman image exists localhost/prime-os:p1-provisional
          sudo -n podman image exists localhost/prime-os:p1
          GRAPHROOT="$(sudo -n podman info --format '{{.Store.GraphRoot}}')"
          WORK="$(mktemp -d /var/tmp/prime-p1-composefs-diag.XXXXXX)"
          cleanup() { sudo -n rm -rf "$WORK"; }
          trap cleanup EXIT

          provisional_digest="$(sudo -n podman run --rm --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v "$GRAPHROOT:$GRAPHROOT:ro" \
            -v "$WORK:/diag" \
            localhost/prime-os:p1 \
            bootc container compute-composefs-digest-from-storage \
              --write-dumpfile-to /diag/provisional.dump \
              localhost/prime-os:p1-provisional | tail -n1)"

          final_digest="$(sudo -n podman run --rm --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v "$GRAPHROOT:$GRAPHROOT:ro" \
            -v "$WORK:/diag" \
            localhost/prime-os:p1 \
            bootc container compute-composefs-digest-from-storage \
              --write-dumpfile-to /diag/final.dump \
              localhost/prime-os:p1 | tail -n1)"

          printf 'PROVISIONAL_DIGEST=%s\nFINAL_DIGEST=%s\n' "$provisional_digest" "$final_digest"
          test "$provisional_digest" != "$final_digest"
          sudo -n chown "$(id -u):$(id -g)" "$WORK/provisional.dump" "$WORK/final.dump"
          printf '%s\n' '--- dumpfile metadata ---'
          wc -l "$WORK/provisional.dump" "$WORK/final.dump"
          sha256sum "$WORK/provisional.dump" "$WORK/final.dump"
          printf '%s\n' '--- changed composefs entries ---'
          diff -u "$WORK/provisional.dump" "$WORK/final.dump" > "$WORK/diff.txt" || true
          test -s "$WORK/diff.txt"
          grep -E '^[+-][^+-]|/boot|EFI/Linux|composefs|usr/lib/modules' "$WORK/diff.txt" | head -n 300 || true
          printf '%s\n' '--- complete diff tail ---'
          tail -n 120 "$WORK/diff.txt"
