name: Execute P1 locked bootc rootfs correction

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
      - name: Consume locked Fedora bootc filesystem directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cf = Path('image/Containerfile')
          s = cf.read_text()
          builder_arg = 'ARG PRIME_ROOTFS_BUILDER_IMAGE\n'
          if s.count(builder_arg) != 1:
              raise SystemExit(f'Containerfile rootfs builder arg count={s.count(builder_arg)}')
          s = s.replace(builder_arg, '', 1)

          start_marker = 'FROM ${PRIME_ROOTFS_BUILDER_IMAGE} AS rootfs-builder\n'
          end_marker = '\n# Reconstruct the Fedora root filesystem into a fresh image layer before sealing.\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Containerfile rootfs-builder boundary missing')
          replacement = '\n'.join([
              'FROM ${PRIME_BASE_IMAGE} AS rootfs-builder',
              '',
              'ARG TARGETARCH',
              'RUN set -eux; \\',
              '    test "${TARGETARCH}" = "amd64"; \\',
              "    grep -q '^ID=fedora$' /usr/lib/os-release; \\",
              "    grep -q '^VERSION_ID=44$' /usr/lib/os-release; \\",
              '    test -x /usr/sbin/bootc; \\',
              '    test -x /usr/bin/systemctl; \\',
              '    test -f /usr/lib/os-release',
              '',
          ])
          s = s[:start] + replacement + s[end:]
          old_copy = 'COPY --from=rootfs-builder /target-rootfs/ /\n'
          new_copy = 'COPY --from=rootfs-builder / /\n'
          if s.count(old_copy) != 1:
              raise SystemExit(f'Containerfile target-rootfs copy count={s.count(old_copy)}')
          s = s.replace(old_copy, new_copy, 1)
          cf.write_text(s)

          proof = Path('tools/prove-p1-local.sh')
          s = proof.read_text()
          cleanup_start = s.find('cleanup_nbd() {\n')
          cleanup_end = s.find('\nlog "P1 local proof preflight"\n', cleanup_start)
          if cleanup_start < 0 or cleanup_end < 0:
              raise SystemExit('proof cleanup boundary missing')
          cleanup = '\n'.join([
              'cleanup_nbd() {',
              '  sudo -n umount "$MOUNT_ESP" 2>/dev/null || true',
              '  sudo -n umount "$MOUNT_XBOOTLDR" 2>/dev/null || true',
              '  sudo -n umount "$MOUNT_ROOT" 2>/dev/null || true',
              '  sudo -n qemu-nbd --disconnect "$NBD_DEV" >/dev/null 2>&1 || true',
              '}',
              'trap cleanup_nbd EXIT',
              '',
          ])
          s = s[:cleanup_start] + cleanup + s[cleanup_end:]

          build_start = s.find('log "Build privileged Fedora rootfs substrate"\n')
          build_end_marker = '\nlog "Build provisional Prime bootc image"\n'
          build_end = s.find(build_end_marker, build_start)
          if build_start < 0 or build_end < 0:
              raise SystemExit('proof privileged rootfs block boundary missing')
          verify = '\n'.join([
              'log "Verify locked Fedora bootc filesystem"',
              '"${PODMAN[@]}" pull "$BASE_IMAGE"',
              '"${PODMAN[@]}" run --rm --entrypoint /bin/bash "$BASE_IMAGE" -ceu \\',
              "  'grep -q \"^ID=fedora$\" /usr/lib/os-release && grep -q \"^VERSION_ID=44$\" /usr/lib/os-release && test -x /usr/sbin/bootc && test -x /usr/bin/systemctl'",
              '',
          ])
          s = s[:build_start] + verify + s[build_end:]

          build_arg = '  --build-arg PRIME_ROOTFS_BUILDER_IMAGE="$ROOTFS_BUILDER_IMAGE" \\\n'
          if s.count(build_arg) != 2:
              raise SystemExit(f'proof rootfs builder build-arg count={s.count(build_arg)}')
          s = s.replace(build_arg, '')
          proof.write_text(s)
          PY

          git diff --check
          grep -F 'FROM ${PRIME_BASE_IMAGE} AS rootfs-builder' image/Containerfile
          grep -F 'COPY --from=rootfs-builder / /' image/Containerfile
          ! grep -q 'PRIME_ROOTFS_BUILDER_IMAGE' image/Containerfile
          ! grep -q 'bootc-base-imagectl build-rootfs' tools/prove-p1-local.sh
          ! grep -q 'ROOTFS_BUILDER_IMAGE' tools/prove-p1-local.sh
          grep -F 'Verify locked Fedora bootc filesystem' tools/prove-p1-local.sh

          git config user.name 'Prime P1 Composer'
          git config user.email 'prime-p1-composer@users.noreply.github.com'
          git add image/Containerfile tools/prove-p1-local.sh
          git commit -m 'fix(p1): consume locked Fedora bootc rootfs directly'
          git push origin HEAD:proof/p1-first-light-final
