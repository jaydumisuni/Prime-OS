name: Execute P1 deterministic rpmdb seal correction

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
      - name: Normalize transient RPM SQLite sidecars before Composefs seal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cf = Path('image/Containerfile')
          s = cf.read_text()
          anchor = '    test -f /usr/lib/systemd/system/prime-recovery.target; \\\n    test -f /usr/lib/systemd/system/prime-recovery.service\n'
          replacement = '    test -f /usr/lib/systemd/system/prime-recovery.target; \\\n    test -f /usr/lib/systemd/system/prime-recovery.service; \\\n    rm -f /usr/share/rpm/rpmdb.sqlite-shm /usr/share/rpm/rpmdb.sqlite-wal; \\\n    test ! -e /usr/share/rpm/rpmdb.sqlite-shm; \\\n    test ! -e /usr/share/rpm/rpmdb.sqlite-wal\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'final seal anchor count={s.count(anchor)}')
          cf.write_text(s.replace(anchor, replacement, 1))
          PY

          git diff --check
          test "$(grep -Fc 'rm -f /usr/share/rpm/rpmdb.sqlite-shm /usr/share/rpm/rpmdb.sqlite-wal' image/Containerfile)" -eq 1
          test "$(grep -Fc 'test ! -e /usr/share/rpm/rpmdb.sqlite-shm' image/Containerfile)" -eq 1
          test "$(grep -Fc 'test ! -e /usr/share/rpm/rpmdb.sqlite-wal' image/Containerfile)" -eq 1
          git diff -- image/Containerfile

          git config user.name 'Prime P1 Composer'
          git config user.email 'prime-p1-composer@users.noreply.github.com'
          git add image/Containerfile
          git commit -m 'fix(p1): normalize transient rpmdb seal state'
          git push origin HEAD:proof/p1-first-light-final
