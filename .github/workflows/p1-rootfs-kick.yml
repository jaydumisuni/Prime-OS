name: Execute P1 privileged rootfs composer

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
      - name: Execute repository-backed composer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/p1-rootfs-compose.yml')
          text = workflow.read_text()
          marker = '        run: |\n'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('composer run block missing')
          body = text[pos + len(marker):]
          script = Path('/tmp/prime-p1-rootfs-compose.sh')
          script.write_text(textwrap.dedent(body))
          extracted = script.read_text()
          if 'Compose exact rootfs privilege correction' not in text:
              raise SystemExit('composer identity missing')
          if 'git push origin HEAD:proof/p1-first-light-final' not in extracted:
              raise SystemExit('composer push authority missing')
          if 'fix(p1): externalize privileged Fedora rootfs compose' not in extracted:
              raise SystemExit('composer commit identity missing')
          PY
          bash /tmp/prime-p1-rootfs-compose.sh
