name: Execute P1 privileged rootfs composer

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
      - name: Compose product-side privileged-rootfs correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cf = Path('image/Containerfile')
          s = cf.read_text()
          anchor = 'ARG PRIME_BASE_IMAGE\n'
          if s.count(anchor) != 1:
              raise SystemExit(f'Containerfile base arg count={s.count(anchor)}')
          s = s.replace(anchor, anchor + 'ARG PRIME_ROOTFS_BUILDER_IMAGE\n', 1)
          start_marker = 'FROM ${PRIME_BASE_IMAGE} AS rootfs-builder\n'
          end_marker = '\n# Reconstruct the Fedora root filesystem into a fresh image layer before sealing.\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Containerfile rootfs-builder boundary missing')
          replacement = '\n'.join([
              'FROM ${PRIME_ROOTFS_BUILDER_IMAGE} AS rootfs-builder', '', 'ARG TARGETARCH',
              'RUN set -eux; \\', '    test "${TARGETARCH}" = "amd64"; \\',
              '    test -x /target-rootfs/usr/sbin/bootc; \\',
              '    test -x /target-rootfs/usr/bin/systemctl; \\',
              '    test -f /target-rootfs/usr/lib/os-release', ''
          ])
          cf.write_text(s[:start] + replacement + s[end:])

          proof = Path('tools/prove-p1-local.sh')
          s = proof.read_text()
          cleanup_start = s.find('cleanup_nbd() {\n')
          cleanup_end = s.find('\nlog "P1 local proof preflight"\n', cleanup_start)
          if cleanup_start < 0 or cleanup_end < 0:
              raise SystemExit('proof cleanup boundary missing')
          cleanup = '\n'.join([
              'cleanup_nbd() {',
              '  sudo -n umount "$MOUNT_ESP" 2>/dev/null || true',
              '  sudo -n umount "$MOUNT_XBOOTLDR" 2>/dev/null || true',
              '  sudo -n umount "$MOUNT_ROOT" 2>/dev/null || true',
              '  sudo -n qemu-nbd --disconnect "$NBD_DEV" >/dev/null 2>&1 || true',
              '}', '', 'ROOTFS_CONTAINER=""', 'ROOTFS_BUILDER_IMAGE=""',
              'cleanup_rootfs_builder() {',
              '  if [[ -n "$ROOTFS_CONTAINER" ]]; then',
              '    "${PODMAN[@]}" rm -f "$ROOTFS_CONTAINER" >/dev/null 2>&1 || true',
              '  fi',
              '  if [[ -n "$ROOTFS_BUILDER_IMAGE" ]]; then',
              '    "${PODMAN[@]}" image rm -f "$ROOTFS_BUILDER_IMAGE" >/dev/null 2>&1 || true',
              '  fi', '}',
              'cleanup_all() {', '  cleanup_nbd', '  cleanup_rootfs_builder', '}',
              'trap cleanup_all EXIT', ''
          ])
          s = s[:cleanup_start] + cleanup + s[cleanup_end:]

          build_anchor = 'log "Build provisional Prime bootc image"\n"${PODMAN[@]}" pull "$BASE_IMAGE"\n'
          if s.count(build_anchor) != 1:
              raise SystemExit(f'proof provisional anchor count={s.count(build_anchor)}')
          privileged = '\n'.join([
              'log "Build privileged Fedora rootfs substrate"',
              '"${PODMAN[@]}" pull "$BASE_IMAGE"',
              'ROOTFS_CONTAINER="prime-p1-rootfs-${SOURCE_REVISION:0:12}"',
              'ROOTFS_BUILDER_IMAGE="localhost/prime-p1-rootfs:${SOURCE_REVISION}"',
              '"${PODMAN[@]}" rm -f "$ROOTFS_CONTAINER" >/dev/null 2>&1 || true',
              '"${PODMAN[@]}" image rm -f "$ROOTFS_BUILDER_IMAGE" >/dev/null 2>&1 || true',
              '"${PODMAN[@]}" run --name "$ROOTFS_CONTAINER" \\',
              '  --privileged \\', '  --security-opt label=disable \\',
              '  --tmpfs /run \\', '  --tmpfs /tmp \\',
              '  --entrypoint /bin/bash \\', '  "$BASE_IMAGE" \\', "  -ceu '",
              '    rm -rf /target-rootfs',
              '    /usr/libexec/bootc-base-imagectl build-rootfs --manifest=standard /target-rootfs',
              '    test -x /target-rootfs/usr/sbin/bootc',
              '    test -x /target-rootfs/usr/bin/systemctl',
              '    test -f /target-rootfs/usr/lib/os-release', "  '",
              '"${PODMAN[@]}" commit "$ROOTFS_CONTAINER" "$ROOTFS_BUILDER_IMAGE" >/dev/null',
              '"${PODMAN[@]}" rm "$ROOTFS_CONTAINER" >/dev/null', 'ROOTFS_CONTAINER=""',
              '"${PODMAN[@]}" run --rm --entrypoint /bin/bash "$ROOTFS_BUILDER_IMAGE" -ceu \\',
              "  'test -x /target-rootfs/usr/sbin/bootc && test -x /target-rootfs/usr/bin/systemctl && test -f /target-rootfs/usr/lib/os-release'",
              '', 'log "Build provisional Prime bootc image"', ''
          ])
          s = s.replace(build_anchor, privileged, 1)
          build_arg = '  --build-arg PRIME_BASE_IMAGE="$BASE_IMAGE" \\\n'
          if s.count(build_arg) != 2:
              raise SystemExit(f'proof base build-arg count={s.count(build_arg)}')
          proof.write_text(s.replace(build_arg, build_arg + '  --build-arg PRIME_ROOTFS_BUILDER_IMAGE="$ROOTFS_BUILDER_IMAGE" \\\n'))
          PY

          git diff --check
          grep -F 'ARG PRIME_ROOTFS_BUILDER_IMAGE' image/Containerfile
          grep -F 'FROM ${PRIME_ROOTFS_BUILDER_IMAGE} AS rootfs-builder' image/Containerfile
          grep -F 'Build privileged Fedora rootfs substrate' tools/prove-p1-local.sh
          test "$(grep -Fc -- '--build-arg PRIME_ROOTFS_BUILDER_IMAGE="$ROOTFS_BUILDER_IMAGE"' tools/prove-p1-local.sh)" -eq 2

          git config user.name 'Prime P1 Composer'
          git config user.email 'prime-p1-composer@users.noreply.github.com'
          git add image/Containerfile tools/prove-p1-local.sh
          git commit -m 'fix(p1): externalize privileged Fedora rootfs compose'
          git push origin HEAD:proof/p1-first-light-final
