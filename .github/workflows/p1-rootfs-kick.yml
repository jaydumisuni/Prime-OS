name: Execute P1 privileged rootfs composer

on:
  pull_request:
    branches:
      - adapter/p1-rootfs-compose-v2
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
      - name: Execute repository-backed composer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/p1-rootfs-compose.yml')
          text = workflow.read_text()
          lines = text.splitlines()
          anchors = [i for i, line in enumerate(lines) if line == '        run: |']
          if not anchors:
              raise SystemExit('composer run block missing')
          start = anchors[0]
          body = []
          for line in lines[start + 1:]:
              if line and not line.startswith('          '):
                  break
              body.append(line[10:] if line.startswith('          ') else '')
          script = Path('/tmp/prime-p1-rootfs-compose.sh')
          script.write_text('\n'.join(body) + '\n')
          if 'Compose exact rootfs privilege correction' not in text:
              raise SystemExit('composer identity missing')
          if 'git push origin HEAD:proof/p1-first-light-final' not in script.read_text():
              raise SystemExit('composer push authority missing')
          PY
          bash /tmp/prime-p1-rootfs-compose.sh
