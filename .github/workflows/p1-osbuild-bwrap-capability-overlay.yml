name: Prime P1 recovery digest env composer

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-recovery-digest-env:
    if: github.event.pull_request.number == 85
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          persist-credentials: true

      - name: Fix bounded digest environment handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/prove-p1-local.sh')
          s = p.read_text()

          old1 = '"${PODMAN[@]}" run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\\n  normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"\\n  recovery="/boot/EFI/Prime/prime-recovery-${CANONICAL_DIGEST}.efi"'
          new1 = '"${PODMAN[@]}" run --rm -e EXPECTED_DIGEST="$CANONICAL_DIGEST" --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\\n  normal="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" ! -name "*.recovery.efi" -print -quit)"\\n  recovery="/boot/EFI/Prime/prime-recovery-${EXPECTED_DIGEST}.efi"'
          if s.count(old1) != 1:
              raise SystemExit(f'UKI digest env anchor count={s.count(old1)}')
          s = s.replace(old1, new1, 1)

          old2 = '  -e EXPECTED_BASE_DIGEST="$BASE_DIGEST" \\\n  --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\\n'
          new2 = '  -e EXPECTED_BASE_DIGEST="$BASE_DIGEST" \\\n  -e EXPECTED_DIGEST="$CANONICAL_DIGEST" \\\n  --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\\n'
          if s.count(old2) != 1:
              raise SystemExit(f'image inspect env anchor count={s.count(old2)}')
          s = s.replace(old2, new2, 1)

          old3 = '    recovery="/boot/EFI/Prime/prime-recovery-${CANONICAL_DIGEST}.efi"'
          new3 = '    recovery="/boot/EFI/Prime/prime-recovery-${EXPECTED_DIGEST}.efi"'
          if s.count(old3) != 1:
              raise SystemExit(f'image inspect recovery anchor count={s.count(old3)}')
          s = s.replace(old3, new3, 1)

          p.write_text(s)
          print('RECOVERY_DIGEST_ENV_FIX=PASS')
          PY

          git diff --check
          grep -F -- '-e EXPECTED_DIGEST="$CANONICAL_DIGEST"' tools/prove-p1-local.sh | wc -l | grep -Fx 3 >/dev/null
          ! grep -F 'recovery="/boot/EFI/Prime/prime-recovery-${CANONICAL_DIGEST}.efi"' tools/prove-p1-local.sh >/dev/null
          git diff -- tools/prove-p1-local.sh

      - name: Publish exact proof candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add tools/prove-p1-local.sh
          git diff --cached --quiet && { echo 'No digest env delta produced'; exit 1; }
          git commit -m 'fix(p1): pass recovery digest into proof containers'
          git push origin HEAD:proof/p1-first-light-final
