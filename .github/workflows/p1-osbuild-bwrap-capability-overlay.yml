name: Prime P1 recovery source hash composer

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-recovery-source-hash:
    if: github.event.pull_request.number == 85
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          persist-credentials: true

      - name: Fix container-side source hash extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/prove-p1-local.sh')
          s = p.read_text()
          old = 'sha256sum "$normal" | awk "{print \\\\$1}"'
          new = 'sha256sum "$normal" | cut -d" " -f1'
          if s.count(old) != 1:
              raise SystemExit(f'normal source hash anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = 'sha256sum "$recovery" | awk "{print \\\\$1}"'
          new = 'sha256sum "$recovery" | cut -d" " -f1'
          if s.count(old) != 1:
              raise SystemExit(f'recovery source hash anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('RECOVERY_SOURCE_HASH_FIX=PASS')
          PY
          git diff --check
          ! grep -F 'awk "{print \\$1}"' tools/prove-p1-local.sh >/dev/null
          grep -F 'sha256sum "$normal" | cut -d" " -f1' tools/prove-p1-local.sh >/dev/null
          grep -F 'sha256sum "$recovery" | cut -d" " -f1' tools/prove-p1-local.sh >/dev/null
          git diff -- tools/prove-p1-local.sh

      - name: Publish exact proof candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add tools/prove-p1-local.sh
          git diff --cached --quiet && { echo 'No source hash delta produced'; exit 1; }
          git commit -m 'fix(p1): make recovery source hash extraction shell-safe'
          git push origin HEAD:proof/p1-first-light-final
