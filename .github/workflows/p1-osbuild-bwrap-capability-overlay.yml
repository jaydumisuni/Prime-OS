name: Prime P1 reversible bwrap complain-window proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: read

jobs:
  prove-complain-window:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 8
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
      POLICY: /etc/apparmor.d/bwrap-userns-restrict
      EXPECTED_POLICY_SHA256: d61facde27707b9c47ffe47921b7273e788784484cb5530eb819e6daac1f1990
    steps:
      - name: Freeze exact host policy and prove complain support
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/fuse
          actual="$(sha256sum "$POLICY" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_POLICY_SHA256"
          apparmor_parser --help 2>&1 | grep -E -- '(^|[[:space:]])-C([,[:space:]]|.*[Cc]omplain)' >/dev/null
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$'
          echo "ORIGINAL_POLICY_SHA256=$actual"

      - name: Run pinned builder in reversible bwrap complain window
        shell: bash
        run: |
          set -u
          out=/var/tmp/prime-p1-bwrap-complain-proof
          restore_policy() {
            sudo -n apparmor_parser -r "$POLICY" >/dev/null 2>&1 || true
          }
          trap restore_policy EXIT INT TERM

          sudo -n apparmor_parser -r -C "$POLICY"
          echo '=== temporary bwrap mode ==='
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \((complain|enforce)\)$'
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(complain\)$' | wc -l | grep -Fx 2

          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          START="$(date '+%Y-%m-%d %H:%M:%S')"

          set +e
          timeout --signal=TERM 75s sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/fuse:/dev/fuse \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-default-fs ext4 \
            --progress verbose \
            qcow2 2>&1 | tee "$out/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "IMAGE_BUILDER_RC=$rc"

          echo '=== relevant stage evidence ==='
          grep -E 'org.osbuild.container-deploy|org.osbuild.bootc.install-to-filesystem|Listing device|mount: /run/osbuild/containers/storage|overlay.*not supported over tmpfs|fuse: device /dev/fuse not found|starting -Pipeline|Pipeline image|org.osbuild\.|Duration:|Failed|Success' "$out/probe.log" | tail -n 320 || true
          echo '=== bwrap AppArmor audit in complain window ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor=.*(unpriv_bwrap|bwrap)' | tail -n 120 || true

          old_mount=0
          old_overlay=0
          old_lsblk=0
          grep -Fq 'mount: /run/osbuild/containers/storage: permission denied' "$out/probe.log" && old_mount=1
          grep -Fq "'overlay' is not supported over tmpfs" "$out/probe.log" && old_overlay=1
          grep -Fq 'Listing device /dev/loop' "$out/probe.log" && old_lsblk=1
          echo "OLD_APPARMOR_MOUNT_FAILURE=$old_mount"
          echo "OLD_FUSE_OVERLAY_FAILURE=$old_overlay"
          echo "OLD_LSBLK_DEVICE_FAILURE=$old_lsblk"

          restore_policy
          trap - EXIT INT TERM
          restored="$(sha256sum "$POLICY" | awk '{print $1}')"
          echo "RESTORED_POLICY_SHA256=$restored"
          test "$restored" = "$EXPECTED_POLICY_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$' | wc -l | grep -Fx 2

          test "$old_mount" -eq 0
          test "$old_overlay" -eq 0
          test "$old_lsblk" -eq 0
          test "$rc" -eq 0 -o "$rc" -eq 124 -o "$rc" -eq 143
          echo BWRAP_COMPLAIN_WINDOW=PROVEN
