name: Prime P1 AppArmor-safe image-builder transport proof

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: read

jobs:
  prove-transport:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 8
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
    steps:
      - name: Extract exact pinned builder bwrap without changing host policy
        shell: bash
        run: |
          set -euo pipefail
          ALT_BWRAP=/var/tmp/prime-p1-image-builder-bwrap
          sudo -n rm -f "$ALT_BWRAP"
          cid="$(sudo -n podman create "$IMAGE_BUILDER")"
          cleanup() { sudo -n podman rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo -n podman cp "$cid:/usr/bin/bwrap" "$ALT_BWRAP"
          cleanup
          trap - EXIT
          sudo -n chmod 0755 "$ALT_BWRAP"
          image_sha="$(sudo -n podman run --rm --entrypoint sha256sum "$IMAGE_BUILDER" /usr/bin/bwrap | awk '{print $1}')"
          host_sha="$(sha256sum "$ALT_BWRAP" | awk '{print $1}')"
          test "$host_sha" = "$image_sha"
          echo "PINNED_BWRAP_SHA256=$host_sha"
          echo '=== host fuse ==='
          ls -l /dev/fuse || true
          stat /dev/fuse || true
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$'

      - name: Prove osbuild path and fuse are visible inside builder
        shell: bash
        run: |
          set -euo pipefail
          ALT_BWRAP=/var/tmp/prime-p1-image-builder-bwrap
          sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/fuse:/dev/fuse \
            -v "$ALT_BWRAP:/usr/sbin/bwrap:ro" \
            --entrypoint /bin/bash \
            "$IMAGE_BUILDER" -ceu '
              echo "DEFAULT_PATH=$PATH"
              echo "DEFAULT_BWRAP=$(command -v bwrap || true)"
              echo "OSBUILD_PATH_BWRAP=$(PATH=/usr/sbin:/usr/bin command -v bwrap || true)"
              echo "--- files ---"
              ls -l /usr/sbin/bwrap /usr/bin/bwrap /dev/fuse || true
              stat /dev/fuse || true
              echo -n "OUTER_SECURITY_ATTR="
              cat /proc/self/attr/current 2>/dev/null || true
              test -x /usr/sbin/bwrap
              test "$(PATH=/usr/sbin:/usr/bin command -v bwrap)" = /usr/sbin/bwrap
              test -e /dev/fuse
              /usr/sbin/bwrap --version
              echo TRANSPORT_PREFLIGHT=PASS
            '

      - name: Run exact image-builder through container-deploy with host AppArmor enforced
        shell: bash
        run: |
          set -u
          ALT_BWRAP=/var/tmp/prime-p1-image-builder-bwrap
          out=/var/tmp/prime-p1-alt-bwrap-builder-proof
          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          START="$(date '+%Y-%m-%d %H:%M:%S')"
          set +e
          timeout --signal=TERM 75s sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --device /dev/fuse:/dev/fuse \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$ALT_BWRAP:/usr/sbin/bwrap:ro" \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-default-fs ext4 \
            --progress verbose \
            qcow2 2>&1 | tee "$out/probe.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "IMAGE_BUILDER_RC=$rc"
          echo '=== relevant stage evidence ==='
          grep -E 'org.osbuild.container-deploy|mount: /run/osbuild/containers/storage|overlay.*not supported over tmpfs|fuse: device /dev/fuse not found|starting -Pipeline|Pipeline build|org.osbuild\.|Duration:|Failed|Success' "$out/probe.log" | tail -n 220 || true
          echo '=== AppArmor bwrap denials during proof ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor="DENIED".*(unpriv_bwrap|bwrap)' || true

          old_mount=0
          old_overlay=0
          grep -Fq 'mount: /run/osbuild/containers/storage: permission denied' "$out/probe.log" && old_mount=1
          grep -Fq "'overlay' is not supported over tmpfs" "$out/probe.log" && old_overlay=1
          echo "OLD_APPARMOR_MOUNT_FAILURE=$old_mount"
          echo "OLD_FUSE_OVERLAY_FAILURE=$old_overlay"
          test "$old_mount" -eq 0
          test "$old_overlay" -eq 0
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$'
