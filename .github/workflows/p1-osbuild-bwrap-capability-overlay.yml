name: Prime P1 recovery digest env composer

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-recovery-digest-env:
    if: github.event.pull_request.number == 85
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          persist-credentials: true

      - name: Fix bounded digest environment handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/prove-p1-local.sh')
          s = p.read_text()

          old = 'UKI_DIGESTS="$("${PODMAN[@]}" run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\n'
          new = 'UKI_DIGESTS="$("${PODMAN[@]}" run --rm -e EXPECTED_DIGEST="$CANONICAL_DIGEST" --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\n'
          if s.count(old) != 1:
              raise SystemExit(f'UKI digest command anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '  -e EXPECTED_BASE_DIGEST="$BASE_DIGEST" \\\n  --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\n'
          new = '  -e EXPECTED_BASE_DIGEST="$BASE_DIGEST" \\\n  -e EXPECTED_DIGEST="$CANONICAL_DIGEST" \\\n  --entrypoint /bin/bash localhost/prime-os:p1 -ceu \'\n'
          if s.count(old) != 1:
              raise SystemExit(f'image inspect env anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'recovery="/boot/EFI/Prime/prime-recovery-${CANONICAL_DIGEST}.efi"'
          new = 'recovery="/boot/EFI/Prime/prime-recovery-${EXPECTED_DIGEST}.efi"'
          if s.count(old) != 2:
              raise SystemExit(f'recovery digest literal count={s.count(old)}')
          s = s.replace(old, new)

          p.write_text(s)
          print('RECOVERY_DIGEST_ENV_FIX=PASS')
          PY

          git diff --check
          test "$(grep -F -- '-e EXPECTED_DIGEST="$CANONICAL_DIGEST"' tools/prove-p1-local.sh | wc -l)" -eq 4
          ! grep -F 'recovery="/boot/EFI/Prime/prime-recovery-${CANONICAL_DIGEST}.efi"' tools/prove-p1-local.sh >/dev/null
          test "$(grep -F 'recovery="/boot/EFI/Prime/prime-recovery-${EXPECTED_DIGEST}.efi"' tools/prove-p1-local.sh | wc -l)" -eq 4
          git diff -- tools/prove-p1-local.sh

      - name: Publish exact proof candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add tools/prove-p1-local.sh
          git diff --cached --quiet && { echo 'No digest env delta produced'; exit 1; }
          git commit -m 'fix(p1): pass recovery digest into proof containers'
          git push origin HEAD:proof/p1-first-light-final
