name: Prime P1 OVMF pflash composer

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened]

permissions:
  contents: write

jobs:
  compose-ovmf-pflash:
    if: github.event.pull_request.number == 85
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply proven KRATOS OVMF pflash invocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/prove-p1-local.sh')
          s = p.read_text()
          old = '''log "Boot normal QCOW2 through OVMF/QEMU"
          rm -f "$OVERLAY" "$SERIAL_LOG"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$DISK")" "$OVERLAY"
          OVMF=""
          for candidate in /usr/share/OVMF/OVMF_CODE.fd /usr/share/OVMF/OVMF_CODE_4M.fd; do
            if [[ -f "$candidate" ]]; then OVMF="$candidate"; break; fi
          done
          [[ -n "$OVMF" ]] || fail "OVMF_CODE firmware not found"
          set +e
          timeout --signal=TERM 120s qemu-system-x86_64 \\
            -machine q35,accel=tcg \\
            -cpu max \\
            -smp 2 \\
            -m 3072 \\
            -bios "$OVMF" \\
            -drive file="$OVERLAY",if=virtio,format=qcow2 \\
            -display none \\
            -serial "file:$SERIAL_LOG" \\
            -monitor none \\
            -net none \\
            -no-reboot
          QEMU_RC=$?
          set -e
          [[ "$QEMU_RC" -eq 0 || "$QEMU_RC" -eq 124 || "$QEMU_RC" -eq 143 ]] || fail "QEMU exited unexpectedly: $QEMU_RC"
          '''
          new = '''log "Boot normal QCOW2 through OVMF/QEMU"
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd
          OVMF_VARS="$RUN_DIR/OVMF_VARS_4M.fd"
          rm -f "$OVERLAY" "$SERIAL_LOG" "$OVMF_VARS"
          qemu-img create -f qcow2 -F qcow2 -b "$(realpath "$DISK")" "$OVERLAY"
          [[ -r "$OVMF_CODE" ]] || fail "OVMF CODE firmware not readable"
          [[ -r "$OVMF_VARS_TEMPLATE" ]] || fail "OVMF VARS template not readable"
          cp "$OVMF_VARS_TEMPLATE" "$OVMF_VARS"
          [[ -w "$OVMF_VARS" ]] || fail "disposable OVMF VARS is not writable"
          set +e
          timeout --signal=TERM 120s qemu-system-x86_64 \\
            -machine q35,accel=tcg \\
            -cpu max \\
            -smp 2 \\
            -m 3072 \\
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \\
            -drive if=pflash,format=raw,file="$OVMF_VARS" \\
            -drive file="$OVERLAY",if=virtio,format=qcow2 \\
            -display none \\
            -serial "file:$SERIAL_LOG" \\
            -monitor none \\
            -net none \\
            -no-reboot
          QEMU_RC=$?
          set -e
          [[ "$QEMU_RC" -eq 0 || "$QEMU_RC" -eq 124 || "$QEMU_RC" -eq 143 ]] || fail "QEMU exited unexpectedly: $QEMU_RC"
          '''
          if s.count(old) != 1:
              raise SystemExit(f'OVMF boot anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          print('OVMF_PFLASH_TRANSPLANT=PASS')
          PY

          git diff --check
          grep -Fx 'OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd' tools/prove-p1-local.sh
          grep -Fx 'OVMF_VARS_TEMPLATE=/usr/share/OVMF/OVMF_VARS_4M.fd' tools/prove-p1-local.sh
          grep -F 'if=pflash,format=raw,readonly=on,file="$OVMF_CODE"' tools/prove-p1-local.sh
          grep -F 'if=pflash,format=raw,file="$OVMF_VARS"' tools/prove-p1-local.sh
          ! grep -F -- '-bios "$OVMF"' tools/prove-p1-local.sh >/dev/null
          git diff -- tools/prove-p1-local.sh

      - name: Publish exact proof candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'THE TECH GUY'
          git config user.email '65334711+jaydumisuni@users.noreply.github.com'
          git add tools/prove-p1-local.sh
          git diff --cached --quiet && { echo 'No OVMF pflash delta produced'; exit 1; }
          git commit -m 'fix(p1): use proven KRATOS OVMF pflash pair'
          git push origin HEAD:proof/p1-first-light-final
