name: Prime P1 post-OVMF guest diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-guest:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 10
    env:
      RUN_DIR: /var/tmp/prime-p1-local-proof/run
      OVERLAY: /var/tmp/prime-p1-local-proof/run/prime-p1-boot-overlay.qcow2
      DISK: /var/tmp/prime-p1-local-proof/run/output/bootc-prime-0.1-qcow2-x86_64.qcow2
      SERIAL: /var/tmp/prime-p1-local-proof/run/prime-serial.log
      VARS: /var/tmp/prime-p1-local-proof/run/OVMF_VARS_4M.fd
      NBD: /dev/nbd1
      MNT: /var/tmp/prime-p1-post-ovmf-diag
    steps:
      - name: Recover exact post-OVMF evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DISK"
          test -f "$OVERLAY"
          test -f "$VARS"

          echo '=== artifact metadata ==='
          qemu-img info "$DISK"
          qemu-img info "$OVERLAY"
          stat -c 'serial size=%s' "$SERIAL" 2>/dev/null || true
          sha256sum "$VARS" /usr/share/OVMF/OVMF_VARS_4M.fd

          echo '=== serial evidence ==='
          if [[ -f "$SERIAL" ]]; then
            wc -c "$SERIAL"
            sed -n '1,240p' "$SERIAL" || true
            echo '--- serial tail ---'
            tail -n 240 "$SERIAL" || true
          else
            echo SERIAL_LOG_MISSING
          fi

          echo '=== OVMF variable strings ==='
          strings -a "$VARS" | grep -E -i 'Boot(Order|Current|Next)|systemd|Linux|Prime|bootc|UEFI|QEMU|EFI' | tail -n 240 || true

          cleanup() {
            sudo -n umount "$MNT/esp" >/dev/null 2>&1 || true
            sudo -n umount "$MNT/boot" >/dev/null 2>&1 || true
            sudo -n umount "$MNT/root" >/dev/null 2>&1 || true
            sudo -n qemu-nbd --disconnect "$NBD" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          rm -rf "$MNT"
          mkdir -p "$MNT/esp" "$MNT/boot" "$MNT/root"

          sudo -n modprobe nbd max_part=16
          sudo -n qemu-nbd --read-only --connect="$NBD" "$OVERLAY"
          sleep 2
          sudo -n partprobe "$NBD"
          echo '=== overlay partition map ==='
          lsblk -b -o NAME,SIZE,TYPE,FSTYPE,PARTTYPE,PARTLABEL "$NBD"

          ESP="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="c12a7328-f81f-11d2-ba4b-00a0c93ec93b" {print $1; exit}')"
          XBOOT="$(lsblk -nrpo NAME,PARTTYPE "$NBD" | awk 'tolower($2)=="bc13c2ff-59e6-4262-a352-b275fd6f7172" {print $1; exit}')"
          ROOT="$(lsblk -b -nrpo NAME,TYPE,FSTYPE,SIZE "$NBD" | awk '$2=="part" && $3=="ext4" {print $4,$1}' | sort -nr | head -n1 | awk '{print $2}')"
          test -n "$ESP"; test -n "$ROOT"
          sudo -n mount -o ro "$ESP" "$MNT/esp"
          [[ -z "$XBOOT" ]] || sudo -n mount -o ro "$XBOOT" "$MNT/boot"
          sudo -n mount -o ro "$ROOT" "$MNT/root"

          echo '=== ESP files / loader configuration ==='
          sudo -n find "$MNT/esp" -maxdepth 5 -type f -printf '%P\n' | sort
          for f in "$MNT/esp/loader/loader.conf" "$MNT/esp"/loader/entries/*.conf; do
            sudo -n test -f "$f" || continue
            echo "--- ${f#$MNT/esp/}"
            sudo -n cat "$f"
          done

          echo '=== XBOOTLDR files ==='
          if [[ -n "$XBOOT" ]]; then
            sudo -n find "$MNT/boot" -maxdepth 5 -type f -printf '%P\n' | sort | head -n 400 || true
          fi

          echo '=== root top-level / bootc state ==='
          sudo -n find "$MNT/root" -maxdepth 3 -mindepth 1 -printf '%y %P -> %l\n' | sort | head -n 500 || true
          for p in \
            "$MNT/root/state/os/default/var/lib/prime" \
            "$MNT/root/var/lib/prime" \
            "$MNT/root/state/os/default/var/log" \
            "$MNT/root/var/log"; do
            if sudo -n test -e "$p"; then
              echo "--- tree ${p#$MNT/root/}"
              sudo -n find "$p" -maxdepth 5 -printf '%y %P -> %l\n' | sort | head -n 600 || true
            fi
          done

          echo '=== persistent journal candidates ==='
          mapfile -t journals < <(sudo -n find "$MNT/root" -type d -path '*/var/log/journal/*' -print 2>/dev/null | head -n 10)
          for j in "${journals[@]}"; do
            echo "--- journal $j"
            sudo -n journalctl --directory="$j" --no-pager -n 300 2>&1 || true
          done

          echo '=== installed normal UKI contract ==='
          UKI="$(sudo -n find "$MNT/esp/EFI/Linux/bootc" -maxdepth 1 -type f -name '*.efi' -print -quit)"
          test -n "$UKI"
          COPY="$RUN_DIR/post-ovmf-normal.efi"
          sudo -n cp "$UKI" "$COPY"
          sudo -n chown "$(id -u):$(id -g)" "$COPY"
          sudo -n podman run --rm --security-opt label=disable -v "$COPY:/tmp/normal.efi:ro" --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            ukify --json=short inspect /tmp/normal.efi > /tmp/inspect.json
            python3 - <<"PY"
import json
x=json.load(open("/tmp/inspect.json"))
print("CMDLINE=" + x[".cmdline"]["text"].strip())
print("OSREL=" + x[".osrel"]["text"].replace("\n", " | "))
PY
          '
          rm -f "$COPY"

          echo POST_OVMF_GUEST_DIAGNOSTIC=PROVEN
