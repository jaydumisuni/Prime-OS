name: Prime Mobile native Android Shell proof
on:
  push:
    branches: [work/prime-mobile-shell-android-20261116]
    paths:
      - 'mobile/shell/**'
      - 'mobile/rom/aosp/**'
      - '.github/workflows/prime-mobile-shell-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Prepare Android SDK API 35
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Compile HOME APK and run pure JVM tests
        run: |
          set -euo pipefail
          gradle -p mobile/shell/android --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Verify HOME activity and no broad app permission
        run: |
          set -euo pipefail
          APK=mobile/shell/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > shell-aapt-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > shell-manifest-tree.txt
          grep -q "package: name='com.thetechguy.prime.mobile'" shell-aapt-badging.txt
          grep -q 'android.intent.category.HOME' shell-manifest-tree.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' shell-manifest-tree.txt
          sha256sum "$APK" > shell-apk-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('mobile/shell/android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'classes.dex' in z.namelist()
              assert 'AndroidManifest.xml' in z.namelist()
          assert p.stat().st_size<8*1024*1024
          print('PRIME_MOBILE_SHELL_APK_COMPILED_TESTED_NOT_ROM')
          PY
      - name: Verify pinned A145P Android 13-era vendor VINTF references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s mobile/rom/aosp -p 'test_*.py' -v
          mkdir -p vendor-evidence
          BASE=https://raw.githubusercontent.com/forforksake/a14m_dump/699855860e672eb5f3582ecf8e2144de0ed8b2d1/vendor/etc/vintf
          curl --fail --location --silent --show-error --retry 2 "$BASE/manifest.xml" -o vendor-evidence/manifest.xml
          curl --fail --location --silent --show-error --retry 2 "$BASE/compatibility_matrix.xml" -o vendor-evidence/compatibility_matrix.xml
          test "$(git hash-object vendor-evidence/manifest.xml)" = 82bef8b1e126e23d4c5049595ede5982a5fb712c
          test "$(git hash-object vendor-evidence/compatibility_matrix.xml)" = 41ef108da5aa9f209a4df85d0f32cba599687bee
          python3 mobile/rom/aosp/a14m_vendor_interface.py \
            --manifest vendor-evidence/manifest.xml \
            --matrix vendor-evidence/compatibility_matrix.xml \
            --output vendor-interface-receipt.json
          python3 - <<'PY_VENDOR'
          import json
          from pathlib import Path
          r=json.loads(Path('vendor-interface-receipt.json').read_text())
          assert r['vendor_fcm_target_level']==5 and r['vendor_ndk_version']==31,r
          assert len(r['essential_historical_hal_declarations'])==8,r
          assert not r['vendor_partition_contents_complete'],r
          assert not r['vintf_framework_compatibility_passed'],r
          assert not r['twrp_install_approved'] and not r['phone_boot_proven'],r
          print('A14M_HISTORICAL_VENDOR_INTERFACE_INVENTORY_ONLY_NOT_AOSP_COMPATIBILITY')
          PY_VENDOR
      - uses: actions/upload-artifact@v4
        with:
          name: prime-mobile-shell-development
          path: |
            mobile/shell/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/shell/android/app/build/test-results/testDebugUnitTest/
            shell-aapt-badging.txt
            shell-manifest-tree.txt
            shell-apk-sha256.txt
            vendor-interface-receipt.json
          retention-days: 7
