name: Prime P1 image-builder mount probe

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 20
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
    steps:
      - name: Host and rootful Podman evidence
        shell: bash
        run: |
          set -u
          echo '=== host ==='
          uname -a
          cat /etc/os-release || true
          echo '=== apparmor ==='
          cat /sys/module/apparmor/parameters/enabled 2>/dev/null || true
          command -v aa-status >/dev/null && sudo -n aa-status || true
          echo '=== rootful podman ==='
          sudo -n podman version
          sudo -n podman info --debug

      - name: Pull exact image-builder
        shell: bash
        run: |
          set -euo pipefail
          sudo -n podman pull "$IMAGE_BUILDER"

      - name: Compare privileged mount namespaces
        shell: bash
        run: |
          set -u
          run_case() {
            name="$1"; shift
            echo
            echo "===== CASE: $name ====="
            sudo -n podman run --rm \
              --privileged \
              --security-opt label=disable \
              "$@" \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              --entrypoint /bin/bash \
              "$IMAGE_BUILDER" -ceu '
                echo "--- identity/capabilities ---"
                id
                grep -E "^(Cap(Inh|Prm|Eff|Bnd|Amb)|NoNewPrivs|Seccomp):" /proc/self/status || true
                echo -n "security-attr: "; cat /proc/self/attr/current 2>/dev/null || true
                echo "--- mounts ---"
                findmnt -T /run || true
                findmnt -T /var/lib/containers/storage || true
                mkdir -p /run/prime-probe-tmpfs /run/prime-probe-bind
                mount -t tmpfs tmpfs /run/prime-probe-tmpfs
                touch /run/prime-probe-tmpfs/ok
                findmnt /run/prime-probe-tmpfs
                umount /run/prime-probe-tmpfs
                mount --bind /var/lib/containers/storage /run/prime-probe-bind
                findmnt /run/prime-probe-bind
                ls -ld /run/prime-probe-bind
                umount /run/prime-probe-bind
                echo MOUNT_PROBE=PASS
              '
            rc=$?
            echo "CASE_RC=$rc"
            return 0
          }

          run_case baseline
          run_case userns-host --userns=host
          run_case apparmor-unconfined --security-opt apparmor=unconfined
          run_case host-userns-apparmor --userns=host --security-opt apparmor=unconfined

      - name: Reproduce image-builder container-deploy under variants
        shell: bash
        run: |
          set -u
          if ! sudo -n podman image exists localhost/prime-os:p1; then
            echo 'LOCAL_PRIME_IMAGE=ABSENT'
            exit 0
          fi
          echo 'LOCAL_PRIME_IMAGE=PRESENT'

          try_builder() {
            name="$1"; shift
            out="/var/tmp/prime-image-builder-probe-$name"
            sudo -n rm -rf "$out"
            sudo -n mkdir -p "$out"
            sudo -n chown "$(id -u):$(id -g)" "$out"
            echo
            echo "===== IMAGE-BUILDER CASE: $name ====="
            set +e
            timeout --signal=TERM 75s sudo -n podman run --rm \
              --privileged \
              --security-opt label=disable \
              "$@" \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v "$out:/output" \
              "$IMAGE_BUILDER" \
              --output-dir /output \
              build \
              --bootc-ref localhost/prime-os:p1 \
              --bootc-default-fs ext4 \
              --progress verbose \
              qcow2 2>&1 | tee "$out/probe.log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "IMAGE_BUILDER_RC=$rc"
            grep -E 'container-deploy|permission denied|Operation not permitted|mount: /run/osbuild/containers/storage|starting -Pipeline|Pipeline build|Duration:|Failed|Success' "$out/probe.log" || true
            return 0
          }

          try_builder baseline
          try_builder userns-host --userns=host
          try_builder apparmor-unconfined --security-opt apparmor=unconfined
          try_builder host-userns-apparmor --userns=host --security-opt apparmor=unconfined

      - name: Probe completed
        shell: bash
        run: echo P1_IMAGE_BUILDER_MOUNT_PROBE=COMPLETE
