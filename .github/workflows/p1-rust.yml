name: Prime P1 Rust

on:
  pull_request:
  push:
    branches:
      - main
      - build/p1-first-light

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assert Rust toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
      - name: Require pinned dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
