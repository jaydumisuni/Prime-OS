name: Construction P1 Shell Interactions v3 Freeze Candidate

on:
  pull_request:
    branches:
      - construction/p1-shell-interactions-v3-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

env:
  PRIME_BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
  PRIME_BASE_IMAGE_ID: sha256:c5231d09e81d63ffd7a25e25895169b93e21193ef63eae0500ac55317a2b8acb
  PRODUCT_BASE: 872b46658863ba0694bd0de017e1a8491047ffa2
  PARENT_READINESS: f1850d3be264cc9a0a0544ba32713e8523cd26d1
  INTERACTIONS_LOCK_SHA256: 771c7f45bf335c2c421d4ccbdc8aeccc306e963cf94fd7fdfede982a4d4903a5
  SHELL_CARGO_HASH: b67fdbb91e9590e5965b27b30b40e30a97e7266f
  SHELL_MAIN_PRE_FIX_HASH: 28b5d65c994ed8e3d1eb77552743eaa92344f8c6
  SHELL_CONTRACT_HASH: d7a9b8fb54b70bb0ba73fd811e8bb1f05bf58c23
  COMPILER_FIX_HASH: 9fad51d2fed8576329c8344151632a714ee2d62f

jobs:
  prove:
    if: ${{ github.head_ref == 'construction/p1-shell-interactions-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact corrected interaction candidate
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-parse "$PRODUCT_BASE^{commit}")" = "$PRODUCT_BASE"
          test "$(git rev-parse "$PARENT_READINESS^{commit}")" = "$PARENT_READINESS"
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | tee /tmp/interaction-files.txt
          while IFS= read -r path; do
            case "$path" in
              crates/prime-shell/Cargo.toml|crates/prime-shell/src/main.rs|docs/contracts/PRIME_P1_SHELL_V1.md|construction/shell-interactions-v3/compiler-fix.patch) ;;
              *) echo "unexpected Shell interactions v3 path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/interaction-files.txt
          test "$(wc -l < /tmp/interaction-files.txt)" -eq 4
          test "$(git hash-object crates/prime-shell/Cargo.toml)" = "$SHELL_CARGO_HASH"
          test "$(git hash-object crates/prime-shell/src/main.rs)" = "$SHELL_MAIN_PRE_FIX_HASH"
          test "$(git hash-object docs/contracts/PRIME_P1_SHELL_V1.md)" = "$SHELL_CONTRACT_HASH"
          test "$(git hash-object construction/shell-interactions-v3/compiler-fix.patch)" = "$COMPILER_FIX_HASH"

          git apply --unidiff-zero --check construction/shell-readiness-v2/main-readiness.patch
          git apply --unidiff-zero construction/shell-readiness-v2/main-readiness.patch
          git apply --check construction/shell-interactions-v3/compiler-fix.patch
          git apply construction/shell-interactions-v3/compiler-fix.patch
          git diff --check
          echo SHELL_MAIN_FINAL_HASH=$(git hash-object crates/prime-shell/src/main.rs)

          grep -F 'configure: &LayerSurfaceConfigure' crates/prime-shell/src/main.rs
          grep -F 'self.configure_transient(layer, &configure)' crates/prime-shell/src/main.rs
          grep -F 'toggle_orb(queue_handle, InteractionSource::Pointer)' crates/prime-shell/src/main.rs
          grep -F 'toggle_orb(queue_handle, InteractionSource::Keyboard)' crates/prime-shell/src/main.rs
          grep -F 'toggle_quick_controls(queue_handle, InteractionSource::Pointer)' crates/prime-shell/src/main.rs
          grep -F 'toggle_quick_controls(queue_handle, InteractionSource::Keyboard)' crates/prime-shell/src/main.rs
          ! grep -F 'std::process::Command' crates/prime-shell/src/main.rs
          ! grep -F '/v1/exec/native/launch' crates/prime-shell/src/main.rs
          echo PRIME_SHELL_INTERACTIONS_V3_RECONSTRUCTION=PASS

      - name: Authenticate Prime-owned substrate
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prove exact corrected interaction candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag handoff/crates/prime-shell/src handoff/docs/contracts
          docker pull "$PRIME_BASE_IMAGE" >/dev/null
          test "$(docker image inspect "$PRIME_BASE_IMAGE" --format '{{.Id}}')" = "$PRIME_BASE_IMAGE_ID"
          docker run --rm \
            -e RUSTUP_HOME=/tmp/prime-rustup \
            -e CARGO_HOME=/tmp/prime-cargo \
            -e INTERACTIONS_LOCK_SHA256="$INTERACTIONS_LOCK_SHA256" \
            -v "$PWD:/work" -w /work "$PRIME_BASE_IMAGE" \
            bash -ceu '
              set -o pipefail
              dnf -y install ca-certificates curl gcc gcc-c++ make pkgconf-pkg-config \
                "pkgconfig(libinput)" "pkgconfig(libudev)" \
                mesa-libgbm-devel-26.1.7-1.fc44 mesa-dri-drivers-26.1.7-1.fc44 \
                mesa-libEGL-26.1.7-1.fc44 mesa-libgbm-26.1.7-1.fc44 \
                "pkgconfig(libseat)" "pkgconfig(xkbcommon)" \
                "pkgconfig(wayland-server)" "pkgconfig(wayland-client)" \
                "pkgconfig(egl)" "pkgconfig(glesv2)" "pkgconfig(libdrm)" >/dev/null
              rm -rf "$RUSTUP_HOME" "$CARGO_HOME"
              mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1 --no-modify-path >/dev/null
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup component add rustfmt clippy --toolchain 1.97.1 >/dev/null
              test "$(rustc --version | awk "{print \$2}")" = "1.97.1"
              rm -f Cargo.lock
              cargo generate-lockfile 2>&1 | tee diag/generate-lock.log
              actual_lock="$(sha256sum Cargo.lock | awk "{print \$1}")"
              printf "%s  Cargo.lock\n" "$actual_lock" | tee diag/Cargo.lock.sha256
              test "$actual_lock" = "$INTERACTIONS_LOCK_SHA256"
              echo PRIME_SHELL_INTERACTIONS_V3_LOCK=PASS
              cargo metadata --locked --no-deps --format-version 1 >/dev/null
              cargo fmt --all -- --check 2>&1 | tee diag/fmt.log
              echo PRIME_SHELL_INTERACTIONS_V3_FMT=PASS
              cargo clippy --locked -p prime-shell -p prime-compositor --all-targets -- -D warnings 2>&1 | tee diag/clippy.log
              echo PRIME_SHELL_INTERACTIONS_V3_CLIPPY=PASS
              cargo test --locked -p prime-compositor 2>&1 | tee diag/compositor-tests.log
              echo PRIME_SHELL_INTERACTIONS_V3_TEST=PASS
              cargo build --locked -p prime-shell --release --bin prime-shell 2>&1 | tee diag/shell-build.log
              cargo build --locked -p prime-compositor --release --bin prime-compositor 2>&1 | tee diag/compositor-build.log
              ! ldd target/release/prime-shell | grep -q "not found"
              ! ldd target/release/prime-compositor | grep -q "not found"
              target/release/prime-shell --help | tee diag/shell-help.log
              target/release/prime-compositor --help | tee diag/compositor-help.log
              echo PRIME_SHELL_INTERACTIONS_V3_BUILD=PASS
            '

          cp Cargo.lock handoff/Cargo.lock
          cp crates/prime-shell/Cargo.toml handoff/crates/prime-shell/Cargo.toml
          cp crates/prime-shell/src/main.rs handoff/crates/prime-shell/src/main.rs
          cp docs/contracts/PRIME_P1_SHELL_V1.md handoff/docs/contracts/PRIME_P1_SHELL_V1.md
          {
            echo PRODUCT_BASE=$PRODUCT_BASE
            echo PARENT_READINESS=$PARENT_READINESS
            echo SOURCE_HEAD=${{ github.event.pull_request.head.sha }}
            echo CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')
            echo SHELL_CARGO_HASH=$(git hash-object crates/prime-shell/Cargo.toml)
            echo SHELL_MAIN_HASH=$(git hash-object crates/prime-shell/src/main.rs)
            echo SHELL_CONTRACT_HASH=$(git hash-object docs/contracts/PRIME_P1_SHELL_V1.md)
            echo COMPOSITOR_MAIN_HASH=$(git hash-object crates/prime-compositor/src/main.rs)
          } | tee handoff/MANIFEST.env
          echo PRIME_SHELL_INTERACTIONS_V3_HANDOFF=PASS

      - uses: actions/upload-artifact@v4
        with:
          name: prime-shell-interactions-v3-${{ github.event.pull_request.head.sha }}
          path: |
            diag/
            handoff/
          if-no-files-found: error
          retention-days: 7
