name: Prime P1 Image

on:
  push:
    branches:
      - main
      - build/p1-first-light

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install privileged bootc build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo fuse-overlayfs
          sudo modprobe fuse || true
          test -e /dev/fuse
          podman --version
          skopeo --version

      - name: Assert Rust toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"

      - name: Resolve locked base input
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base_image="$(python3 -c 'import json; print(json.load(open("image/fedora-base.lock.json"))["pinned_reference"])')"
          base_digest="$(python3 -c 'import json; print(json.load(open("image/fedora-base.lock.json"))["manifest_digest"])')"
          test -n "$base_image"
          case "$base_digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          printf 'image=%s\n' "$base_image" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$base_digest" >> "$GITHUB_OUTPUT"
          sudo podman pull "$base_image"

      - name: Build Prime Core release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo build --locked --release -p primed
          test -x target/release/primed

      - name: Build provisional Prime bootc image
        id: build
        shell: bash
        env:
          PRIME_BASE_IMAGE: ${{ steps.base.outputs.image }}
          PRIME_BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          created_at="$(git show -s --format=%cI HEAD)"
          generation_id="p1-first-light-${source_revision:0:12}"
          printf 'source_revision=%s\n' "$source_revision" >> "$GITHUB_OUTPUT"
          printf 'created_at=%s\n' "$created_at" >> "$GITHUB_OUTPUT"
          printf 'generation_id=%s\n' "$generation_id" >> "$GITHUB_OUTPUT"
          sudo podman build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --build-arg PRIME_BASE_IMAGE="$PRIME_BASE_IMAGE" \
            --build-arg PRIME_BASE_DIGEST="$PRIME_BASE_DIGEST" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$generation_id" \
            --build-arg PRIME_SOURCE_REVISION="$source_revision" \
            --build-arg PRIME_CREATED_AT="$created_at" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            -f image/Containerfile \
            -t localhost/prime-os:p1-provisional .

      - name: Compute provisional canonical storage digest
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1-provisional \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1-provisional | tail -n1)"
          case "$digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) echo "invalid canonical digest: $digest" >&2; exit 1 ;; esac
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'provisional canonical storage digest: %s\n' "$digest"

      - name: Rebuild Prime with canonical UKI seal
        shell: bash
        env:
          PRIME_BASE_IMAGE: ${{ steps.base.outputs.image }}
          PRIME_BASE_DIGEST: ${{ steps.base.outputs.digest }}
          PRIME_COMPOSEFS_DIGEST: ${{ steps.canonical.outputs.digest }}
          SOURCE_REVISION: ${{ steps.build.outputs.source_revision }}
          CREATED_AT: ${{ steps.build.outputs.created_at }}
          GENERATION_ID: ${{ steps.build.outputs.generation_id }}
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add=all \
            --device /dev/fuse \
            --security-opt label=disable \
            --platform linux/amd64 \
            --build-arg PRIME_BASE_IMAGE="$PRIME_BASE_IMAGE" \
            --build-arg PRIME_BASE_DIGEST="$PRIME_BASE_DIGEST" \
            --build-arg TARGETARCH=amd64 \
            --build-arg PRIME_GENERATION_ID="$GENERATION_ID" \
            --build-arg PRIME_SOURCE_REVISION="$SOURCE_REVISION" \
            --build-arg PRIME_CREATED_AT="$CREATED_AT" \
            --build-arg PRIME_BOOT_ATTEMPT_LIMIT=3 \
            --build-arg PRIME_COMPOSEFS_DIGEST="$PRIME_COMPOSEFS_DIGEST" \
            -f image/Containerfile \
            -t localhost/prime-os:p1 .

      - name: Inspect Prime image contract
        shell: bash
        env:
          EXPECTED_SOURCE_REVISION: ${{ steps.build.outputs.source_revision }}
          EXPECTED_CREATED_AT: ${{ steps.build.outputs.created_at }}
          EXPECTED_GENERATION_ID: ${{ steps.build.outputs.generation_id }}
          EXPECTED_BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          sudo podman run --rm \
            -e EXPECTED_SOURCE_REVISION="$EXPECTED_SOURCE_REVISION" \
            -e EXPECTED_CREATED_AT="$EXPECTED_CREATED_AT" \
            -e EXPECTED_GENERATION_ID="$EXPECTED_GENERATION_ID" \
            -e EXPECTED_BASE_DIGEST="$EXPECTED_BASE_DIGEST" \
            --entrypoint /bin/bash \
            localhost/prime-os:p1 -ceu '
              test -x /usr/libexec/prime/primed
              test -x /usr/sbin/bootc
              test -x /usr/sbin/systemd-run
              test -x /usr/bin/ukify
              test -f /usr/lib/systemd/boot/efi/systemd-bootx64.efi
              test -f /usr/lib/systemd/boot/efi/linuxx64.efi.stub
              test -f /usr/lib/prime/generation-seed.json
              test -f /usr/lib/bootc/install/10-prime.toml
              test -L /etc/systemd/system/multi-user.target.wants/primed.service
              test ! -e /etc/systemd/system/timers.target.wants/bootc-fetch-apply-updates.timer
              ! rpm -q bootupd >/dev/null 2>&1
              rpm -q systemd-ukify-259.8-1.fc44 systemd-boot-unsigned-259.8-1.fc44
              test "$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" | wc -l)" -eq 1
              ! find /usr/lib/modules -type f \( -name vmlinuz -o -name initramfs.img \) -print -quit | grep -q .
              bootc container lint --fatal-warnings
              bootc container inspect --json > /tmp/prime-bootc-container.json
              bootc install print-configuration > /tmp/prime-bootc-install.json
              cat /tmp/prime-bootc-container.json
              cat /tmp/prime-bootc-install.json
              python3 -c '\''import json; c=json.load(open("/tmp/prime-bootc-container.json")); assert c["kernel"]["unified"] is True, c; i=json.load(open("/tmp/prime-bootc-install.json")); assert i.get("bootloader") == "systemd", i'\''
              python3 -c '\''import json, os; seed=json.load(open("/usr/lib/prime/generation-seed.json", "r", encoding="utf-8")); assert seed["schema"] == "prime.generation-seed.v1"; assert seed["generation_id"] == os.environ["EXPECTED_GENERATION_ID"]; assert seed["channel"] == "LAB"; assert seed["created_at"] == os.environ["EXPECTED_CREATED_AT"]; assert seed["source_revision"] == os.environ["EXPECTED_SOURCE_REVISION"]; assert seed["base_image_digest"] == os.environ["EXPECTED_BASE_DIGEST"]; assert seed["boot_attempt_limit"] == 3'\''
            '

      - name: Prove final UKI and OCI storage share one seal
        id: seal
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.canonical.outputs.digest }}
        run: |
          set -euo pipefail
          final_digest="$(sudo podman run --rm \
            --privileged \
            --security-opt label=disable \
            --tmpfs /var/tmp:size=8g \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            localhost/prime-os:p1 \
            bootc container compute-composefs-digest-from-storage localhost/prime-os:p1 | tail -n1)"
          embedded_digest="$(sudo podman run --rm --entrypoint /bin/bash localhost/prime-os:p1 -ceu '
            uki="$(find /boot/EFI/Linux -maxdepth 1 -type f -name "*.efi" -print -quit)"
            test -n "$uki"
            grep -aoE "composefs=[0-9a-f]{128}" "$uki" | head -n1 | cut -d= -f2
          ')"
          case "$final_digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          case "$embedded_digest" in ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          printf 'provisional canonical digest: %s\n' "$EXPECTED_DIGEST"
          printf 'final canonical digest:       %s\n' "$final_digest"
          printf 'UKI embedded digest:          %s\n' "$embedded_digest"
          test "$final_digest" = "$EXPECTED_DIGEST"
          test "$embedded_digest" = "$EXPECTED_DIGEST"
          printf 'digest=%s\n' "$final_digest" >> "$GITHUB_OUTPUT"

      - name: Compute OCI manifest evidence
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.build.outputs.source_revision }}
          CREATED_AT: ${{ steps.build.outputs.created_at }}
          GENERATION_ID: ${{ steps.build.outputs.generation_id }}
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
          COMPOSEFS_DIGEST: ${{ steps.seal.outputs.digest }}
        run: |
          set -euo pipefail
          sudo podman save --format oci-archive -o /tmp/prime-p1.oci.tar localhost/prime-os:p1
          sudo chmod 0644 /tmp/prime-p1.oci.tar
          skopeo inspect --raw oci-archive:/tmp/prime-p1.oci.tar > /tmp/prime-p1.manifest.json
          manifest_digest="sha256:$(sha256sum /tmp/prime-p1.manifest.json | awk '{print $1}')"
          image_id="$(sudo podman image inspect localhost/prime-os:p1 --format '{{.Id}}')"
          cat > /tmp/prime-p1-image-evidence.json <<EOF
          {
            "schema": "prime.image-build-evidence.v1",
            "source_revision": "$SOURCE_REVISION",
            "generation_id": "$GENERATION_ID",
            "created_at": "$CREATED_AT",
            "base_image_digest": "$BASE_DIGEST",
            "composefs_storage_digest": "$COMPOSEFS_DIGEST",
            "oci_archive_manifest_digest": "$manifest_digest",
            "podman_image_id": "$image_id",
            "platform": "linux/amd64",
            "deployment_backend": "COMPOSEFS_CANONICAL_TWO_PASS_SEAL_PROVEN_PENDING_DISK_PROOF",
            "bootloader": "SYSTEMD_BOOT_EXPLICIT_BOOTC_INSTALL_POLICY_PENDING_DISK_PROOF",
            "secure_boot": "DISABLED_OR_UNPROVEN_FOR_P1"
          }
          EOF
          python3 -m json.tool /tmp/prime-p1-image-evidence.json
          {
            echo '### Prime P1 image evidence'
            echo '```json'
            cat /tmp/prime-p1-image-evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
