name: Prime P1 osbuild AppArmor audit

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 10
    env:
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:dcce024476c13edfe5a1e45a4a492435a3b5eae9ed8a09765f7f75b3912e708b
    steps:
      - name: Record namespace policy
        shell: bash
        run: |
          set -u
          echo '=== namespace policy ==='
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
          sysctl user.max_user_namespaces 2>/dev/null || true
          echo '=== relevant AppArmor profiles ==='
          sudo -n aa-status 2>/dev/null | grep -E 'bwrap|unprivileged_userns|podman|crun' || true

      - name: Reproduce one exact container-deploy failure
        shell: bash
        run: |
          set -u
          START="$(date '+%Y-%m-%d %H:%M:%S')"
          echo "AUDIT_START=$START"
          out=/var/tmp/prime-osbuild-apparmor-audit
          sudo -n rm -rf "$out"
          sudo -n mkdir -p "$out"
          sudo -n chown "$(id -u):$(id -g)" "$out"
          set +e
          sudo -n podman run --rm \
            --privileged \
            --security-opt label=disable \
            --security-opt apparmor=unconfined \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$out:/output" \
            "$IMAGE_BUILDER" \
            --output-dir /output \
            build \
            --bootc-ref localhost/prime-os:p1 \
            --bootc-default-fs ext4 \
            --progress verbose \
            qcow2
          rc=$?
          set -e
          echo "IMAGE_BUILDER_RC=$rc"
          echo '=== kernel audit since reproduction ==='
          sudo -n journalctl -k --since "$START" --no-pager 2>/dev/null | grep -Ei 'apparmor|audit|DENIED|bwrap|unprivileged_userns|sys_admin|operation="mount"' || true
          echo '=== recent kernel audit fallback ==='
          sudo -n dmesg --ctime 2>/dev/null | tail -n 250 | grep -Ei 'apparmor|audit|DENIED|bwrap|unprivileged_userns|sys_admin|operation="mount"' || true

      - name: Audit completed
        shell: bash
        run: echo P1_OSBUILD_APPARMOR_AUDIT=COMPLETE
