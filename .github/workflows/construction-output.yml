name: Construction P1 Mesa 26.1.7 Refresh

# Temporary construction transport only. Not Prime acceptance authority.
on:
  pull_request:
    branches:
      - build/p1-first-light
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  compile:
    if: ${{ github.head_ref == 'construction/p1-compositor-output-mesa-refresh' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIME_CONSTRUCTION_SHA: ${{ github.event.pull_request.head.sha }}
      PRIME_HEAD_REF: ${{ github.head_ref }}
      PRIME_BASE_IMAGE: quay.io/fedora/fedora-bootc:44-x86_64@sha256:22e13c6a08efc0ad90466b15d5921b3ee0a1ba02ae1546d8733e110c8230a781
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIME_CONSTRUCTION_SHA }}
          fetch-depth: 0
      - name: Freeze exact construction SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIME_CONSTRUCTION_SHA"
      - name: Generate guarded Mesa refresh
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "26.1.6-1.fc44"
          new = "26.1.7-1.fc44"
          paths = [Path("image/Containerfile"), Path("tools/prove-p1-local.sh")]
          changed = 0
          counts = {}
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              counts[str(path)] = count
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed += count
          if changed == 0:
              print("Mesa authority files already contain no 26.1.6 pin")
          else:
              print(f"Replaced {changed} exact Mesa pin occurrences: {counts}")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  raise SystemExit(f"stale Mesa pin remains in {path}")
              if new not in text:
                  raise SystemExit(f"refreshed Mesa pin missing in {path}")
          PY
          if git diff --quiet -- image/Containerfile tools/prove-p1-local.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            test "$(git diff --name-only | sort)" = $'image/Containerfile\ntools/prove-p1-local.sh'
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add image/Containerfile tools/prove-p1-local.sh
            git commit -m "construction: refresh Mesa package pins to 26.1.7"
            git push origin "HEAD:${PRIME_HEAD_REF}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify package authority files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mesa-libgbm-devel-26.1.7-1.fc44.x86_64' image/Containerfile
          grep -Fq 'mesa-dri-drivers-26.1.7-1.fc44' image/Containerfile
          grep -Fq 'mesa-libEGL-26.1.7-1.fc44' image/Containerfile
          grep -Fq 'mesa-libgbm-26.1.7-1.fc44' image/Containerfile
          grep -Fq 'mesa-dri-drivers-26.1.7-1.fc44' tools/prove-p1-local.sh
          grep -Fq 'mesa-libEGL-26.1.7-1.fc44' tools/prove-p1-local.sh
          grep -Fq 'mesa-libgbm-26.1.7-1.fc44' tools/prove-p1-local.sh
          ! grep -RFn '26.1.6-1.fc44' image/Containerfile tools/prove-p1-local.sh
      - name: Prove exact Mesa packages and compositor build
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$PRIME_BASE_IMAGE"
          docker run --rm \
            -e RUSTUP_HOME=/tmp/prime-rustup \
            -e CARGO_HOME=/tmp/prime-cargo \
            -v "$PWD:/work" \
            -w /work \
            "$PRIME_BASE_IMAGE" \
            bash -ceu '
              dnf -y install \
                ca-certificates curl gcc gcc-c++ make pkgconf-pkg-config \
                "pkgconfig(libinput)" "pkgconfig(libudev)" \
                mesa-libgbm-devel-26.1.7-1.fc44 \
                mesa-dri-drivers-26.1.7-1.fc44 \
                mesa-libEGL-26.1.7-1.fc44 \
                mesa-libgbm-26.1.7-1.fc44 \
                "pkgconfig(libseat)" "pkgconfig(xkbcommon)" \
                "pkgconfig(wayland-server)" "pkgconfig(egl)" \
                "pkgconfig(glesv2)" "pkgconfig(libdrm)"
              test "$(rpm -q --whatprovides "pkgconfig(gbm)" --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n")" = "mesa-libgbm-devel-26.1.7-1.fc44.x86_64"
              rpm -q \
                mesa-dri-drivers-26.1.7-1.fc44 \
                mesa-libEGL-26.1.7-1.fc44 \
                mesa-libgbm-26.1.7-1.fc44
              test "$(rpm -qf /usr/lib64/libEGL_mesa.so.0)" = "mesa-libEGL-26.1.7-1.fc44.x86_64"
              test "$(rpm -qf /usr/lib64/libgbm.so.1)" = "mesa-libgbm-26.1.7-1.fc44.x86_64"
              test "$(rpm -qf /usr/lib64/dri/iris_dri.so)" = "mesa-dri-drivers-26.1.7-1.fc44.x86_64"
              rm -rf "$RUSTUP_HOME" "$CARGO_HOME"
              mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- \
                -y --profile minimal --default-toolchain 1.97.1 --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup component add rustfmt clippy --toolchain 1.97.1
              cargo metadata --locked --no-deps --format-version 1 >/dev/null
              cargo fmt --all -- --check
              cargo clippy --locked -p prime-compositor --all-targets -- -D warnings
              cargo build --locked -p prime-compositor --release --bin prime-compositor
              ! ldd target/release/prime-compositor | grep -q "not found"
              target/release/prime-compositor --help
              echo PRIME_MESA_2617_PACKAGE_CLOSURE=PASS
            '
      - name: Build exact compositor-builder stage
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --platform=linux/amd64 \
            --target compositor-builder \
            --build-arg PRIME_BASE_IMAGE="$PRIME_BASE_IMAGE" \
            -f image/Containerfile \
            .
          echo PRIME_MESA_2617_BUILDER_STAGE=PASS
