name: Prime P1 Full Proof

# Self-hosted transport adapter only. The canonical proof is
# tools/prove-p1-local.sh executing on the Kratos proof Host.
on:
  pull_request:
    branches:
      - build/p1-first-light
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: prime-p1-proof-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  proof:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'proof/p1-') }}
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 120
    env:
      PRIME_P1_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PRIME_P1_CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Freeze exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIME_P1_CANDIDATE_SHA"
          printf 'P1_PROOF_CANDIDATE=%s\n' "$PRIME_P1_CANDIDATE_SHA"
      - name: Authenticate locked Prime substrate
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf '%s' "$GHCR_TOKEN" | sudo -n podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run canonical Prime P1 proof
        shell: bash
        env:
          BUILDAH_ISOLATION: chroot
        run: |
          set -euo pipefail
          chmod +x tools/prove-p1-local.sh
          tools/prove-p1-local.sh
      - name: Remove ephemeral registry credentials
        if: ${{ always() }}
        shell: bash
        run: |
          skopeo logout ghcr.io >/dev/null 2>&1 || true
          sudo -n podman logout ghcr.io >/dev/null 2>&1 || true
