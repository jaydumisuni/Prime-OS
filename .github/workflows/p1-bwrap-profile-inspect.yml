name: Prime P1 bwrap AppArmor profile inspect

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [reopened, synchronize]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 5
    steps:
      - name: Locate and print bwrap policy
        shell: bash
        run: |
          set -u
          echo '=== matching policy files ==='
          sudo -n grep -RIlE '(^|[[:space:]])(profile[[:space:]]+)?(unpriv_)?bwrap([[:space:]{]|$)' /etc/apparmor.d 2>/dev/null | sort | tee /tmp/prime-bwrap-policy-files || true
          echo '=== policy contents ==='
          while IFS= read -r file; do
            test -n "$file" || continue
            echo "----- $file -----"
            sudo -n sed -n '1,260p' "$file"
          done < /tmp/prime-bwrap-policy-files
          echo '=== parser/tools ==='
          command -v apparmor_parser || true
          command -v aa-complain || true
          command -v aa-enforce || true
          apparmor_parser --version 2>/dev/null || true
          echo '=== loaded bwrap profile lines ==='
          sudo -n cat /sys/kernel/security/apparmor/profiles 2>/dev/null | grep -E '(^|//)(unpriv_)?bwrap ' || true
