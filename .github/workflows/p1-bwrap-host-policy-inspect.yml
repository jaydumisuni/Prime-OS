name: Prime P1 bwrap host policy inspect

on:
  pull_request:
    branches:
      - adapter/p1-image-builder-mount-probe
    types: [synchronize]

permissions:
  contents: read

jobs:
  inspect-policy:
    if: github.event.pull_request.number == 85
    runs-on: [self-hosted, linux, x64, kratos]
    timeout-minutes: 3
    env:
      POLICY: /etc/apparmor.d/bwrap-userns-restrict
      EXPECTED_POLICY_SHA256: d61facde27707b9c47ffe47921b7273e788784484cb5530eb819e6daac1f1990
    steps:
      - name: Recover exact enforced bwrap policy
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum "$POLICY" | awk '{print $1}')"
          echo "POLICY_SHA256=$actual"
          test "$actual" = "$EXPECTED_POLICY_SHA256"
          sudo -n cat /sys/kernel/security/apparmor/profiles | grep -E '^(unpriv_bwrap|bwrap) \(enforce\)$'
          echo '=== exact policy ==='
          sudo -n nl -ba "$POLICY"
          echo '=== parser-expanded policy ==='
          sudo -n apparmor_parser -p "$POLICY" | sed -n '1,260p'
