name: Prime P1 Builder Runtime Repair

on:
  push:
    branches:
      - build/p1-first-light
    paths:
      - .github/workflows/p1-builder-runtime-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: proof/p1-first-light-final
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply explicit image-builder mount authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/prove-p1-local.sh')
          text = path.read_text()

          anchor = '''log "Prove pinned image-builder sees unified Prime image"
          "${PODMAN[@]}" pull "$BUILDER_REF"
          "${PODMAN[@]}" run --rm "$BUILDER_REF" version
          "${PODMAN[@]}" run --rm \\
            --privileged \\
            --security-opt label=disable \\
            -v /var/lib/containers/storage:/var/lib/containers/storage \\
            "$BUILDER_REF" \\
            bootc inspect --ref localhost/prime-os:p1 --format json > "$RUN_DIR/prime-image-builder-inspect.json"
          '''
          replacement = '''log "Prove pinned image-builder sees unified Prime image"
          "${PODMAN[@]}" pull "$BUILDER_REF"
          "${PODMAN[@]}" run --rm "$BUILDER_REF" version
          BUILDER_RUN_ARGS=(
            --privileged
            --user 0:0
            --userns=host
            --cap-add=SYS_ADMIN
            --cap-add=MKNOD
            --security-opt label=disable
          )

          log "Prove pinned image-builder nested mount authority"
          "${PODMAN[@]}" run --rm \\
            "${BUILDER_RUN_ARGS[@]}" \\
            -v /var/lib/containers/storage:/var/lib/containers/storage \\
            --entrypoint /bin/bash \\
            "$BUILDER_REF" -ceu '
              test "$(id -u)" -eq 0
              mkdir -p /run/osbuild/containers/storage
              trap '\''umount --lazy /run/osbuild/containers/storage >/dev/null 2>&1 || true'\'' EXIT
              mount --make-private -o rbind,rw,0755 /var/lib/containers/storage /run/osbuild/containers/storage
              findmnt -n /run/osbuild/containers/storage >/dev/null
            '

          "${PODMAN[@]}" run --rm \\
            "${BUILDER_RUN_ARGS[@]}" \\
            -v /var/lib/containers/storage:/var/lib/containers/storage \\
            "$BUILDER_REF" \\
            bootc inspect --ref localhost/prime-os:p1 --format json > "$RUN_DIR/prime-image-builder-inspect.json"
          '''
          if anchor not in text:
              raise SystemExit('image-builder inspect anchor missing')
          text = text.replace(anchor, replacement, 1)

          old_build = '''"${PODMAN[@]}" run --rm \\
            --privileged \\
            --security-opt label=disable \\
            -v /var/lib/containers/storage:/var/lib/containers/storage \\
            -v "$OUTPUT_DIR:/output" \\
            "$BUILDER_REF" \\
          '''
          new_build = '''"${PODMAN[@]}" run --rm \\
            "${BUILDER_RUN_ARGS[@]}" \\
            -v /var/lib/containers/storage:/var/lib/containers/storage \\
            -v "$OUTPUT_DIR:/output" \\
            "$BUILDER_REF" \\
          '''
          if old_build not in text:
              raise SystemExit('image-builder build anchor missing')
          text = text.replace(old_build, new_build, 1)

          path.write_text(text)

          repaired = path.read_text()
          assert repaired.count('BUILDER_RUN_ARGS=(') == 1
          assert repaired.count('--userns=host') == 1
          assert repaired.count('--cap-add=SYS_ADMIN') == 1
          assert repaired.count('--cap-add=MKNOD') == 1
          assert repaired.count('Prove pinned image-builder nested mount authority') == 1
          assert repaired.count('"${BUILDER_RUN_ARGS[@]}"') == 3
          assert repaired.count('mount --make-private -o rbind,rw,0755 /var/lib/containers/storage /run/osbuild/containers/storage') == 1
          PY

      - name: Freeze and publish runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = tools/prove-p1-local.sh
          git config user.name "THE TECH GUY"
          git config user.email "65334711+jaydumisuni@users.noreply.github.com"
          git add tools/prove-p1-local.sh
          git commit -m "fix(p1): grant image-builder mount authority"
          git push origin HEAD:proof/p1-first-light-final
