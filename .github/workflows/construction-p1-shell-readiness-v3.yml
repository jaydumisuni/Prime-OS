name: Construction P1 Shell Readiness v3 Build

on:
  pull_request:
    branches:
      - construction/p1-shell-readiness-v3-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

env:
  PRIME_BASE_IMAGE: ghcr.io/jaydumisuni/prime-fedora-base@sha256:487539bd9b2618f15ce3e86375dfb8ec694af30481bb699f8fc74c0947c20341
  PRIME_BASE_IMAGE_ID: sha256:c5231d09e81d63ffd7a25e25895169b93e21193ef63eae0500ac55317a2b8acb
  PRODUCT_BASE: 872b46658863ba0694bd0de017e1a8491047ffa2
  SHELL_LOCK_SHA256: d8c87bc9c7aa116ae85a407d23058dfb7fe1bc5c2955a8df677747ba201a2d47

jobs:
  prove:
    if: ${{ github.head_ref == 'construction/p1-shell-readiness-v3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fence source scope and reconstruct exact main integration
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-parse "$PRODUCT_BASE^{commit}")" = "$PRODUCT_BASE"
          git diff --check "$base" HEAD -- . ':(exclude)construction/shell-readiness-v2/main-readiness.patch'
          git diff --name-only "$base" HEAD | tee /tmp/readiness-files.txt
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|crates/prime-shell/Cargo.toml|crates/prime-shell/src/main.rs|crates/prime-compositor/src/shell.rs|crates/prime-compositor/src/frame.rs|crates/prime-compositor/src/protocols.rs|docs/contracts/PRIME_P1_SHELL_V1.md|construction/shell-readiness-v2/main-readiness.patch) ;;
              *) echo "unexpected Shell readiness v3 path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/readiness-files.txt
          test "$(wc -l < /tmp/readiness-files.txt)" -eq 8

          git apply --check construction/shell-readiness-v2/main-readiness.patch
          git apply construction/shell-readiness-v2/main-readiness.patch
          git diff --check

          grep -F 'mod shell;' crates/prime-compositor/src/main.rs
          grep -F 'backgrounds.len() != 1 || rails.len() != 1' crates/prime-compositor/src/shell.rs
          grep -F 'persistent_baseline_identity_renderable' crates/prime-compositor/src/frame.rs
          grep -F 'invalidate_shell_readiness' crates/prime-compositor/src/protocols.rs
          grep -F 'shell::SHELL_NOT_PROVEN_LIMITATION' crates/prime-compositor/src/main.rs
          grep -F 'Prime Shell persistent baseline has not retired in a selected-CRTC frame' crates/prime-compositor/src/shell.rs
          grep -F 'Persistent baseline: background + rail; Orb/quick-controls remain transient' crates/prime-shell/src/main.rs
          grep -F 'The persistent baseline is `prime.shell.background` plus `prime.shell.rail`.' docs/contracts/PRIME_P1_SHELL_V1.md
          echo PRIME_SHELL_READINESS_V3_SCOPE=PASS

      - name: Authenticate Prime-owned substrate
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prove readiness candidate with frozen dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          docker pull "$PRIME_BASE_IMAGE" >/dev/null
          test "$(docker image inspect "$PRIME_BASE_IMAGE" --format '{{.Id}}')" = "$PRIME_BASE_IMAGE_ID"
          docker run --rm \
            -e RUSTUP_HOME=/tmp/prime-rustup \
            -e CARGO_HOME=/tmp/prime-cargo \
            -e SHELL_LOCK_SHA256="$SHELL_LOCK_SHA256" \
            -v "$PWD:/work" -w /work "$PRIME_BASE_IMAGE" \
            bash -ceu '
              set -o pipefail
              dnf -y install ca-certificates curl gcc gcc-c++ make pkgconf-pkg-config \
                "pkgconfig(libinput)" "pkgconfig(libudev)" \
                mesa-libgbm-devel-26.1.7-1.fc44 mesa-dri-drivers-26.1.7-1.fc44 \
                mesa-libEGL-26.1.7-1.fc44 mesa-libgbm-26.1.7-1.fc44 \
                "pkgconfig(libseat)" "pkgconfig(xkbcommon)" \
                "pkgconfig(wayland-server)" "pkgconfig(wayland-client)" \
                "pkgconfig(egl)" "pkgconfig(glesv2)" "pkgconfig(libdrm)" >/dev/null
              rm -rf "$RUSTUP_HOME" "$CARGO_HOME"
              mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.1 --no-modify-path >/dev/null
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup component add rustfmt clippy --toolchain 1.97.1 >/dev/null
              test "$(rustc --version | awk "{print \$2}")" = "1.97.1"
              rm -f Cargo.lock
              cargo generate-lockfile 2>&1 | tee diag/generate-lock.log
              actual_lock="$(sha256sum Cargo.lock | awk "{print \$1}")"
              printf "%s  Cargo.lock\n" "$actual_lock" | tee diag/Cargo.lock.sha256
              test "$actual_lock" = "$SHELL_LOCK_SHA256"
              echo PRIME_SHELL_READINESS_V3_LOCK=PASS
              cargo metadata --locked --no-deps --format-version 1 >/dev/null
              cargo fmt --all -- --check 2>&1 | tee diag/fmt.log
              echo PRIME_SHELL_READINESS_V3_FMT=PASS
              cargo clippy --locked -p prime-compositor -p prime-shell --all-targets -- -D warnings 2>&1 | tee diag/clippy.log
              echo PRIME_SHELL_READINESS_V3_CLIPPY=PASS
              cargo test --locked -p prime-compositor 2>&1 | tee diag/compositor-tests.log
              echo PRIME_SHELL_READINESS_V3_TEST=PASS
              cargo build --locked -p prime-compositor --release --bin prime-compositor 2>&1 | tee diag/compositor-build.log
              cargo build --locked -p prime-shell --release --bin prime-shell 2>&1 | tee diag/shell-build.log
              ! ldd target/release/prime-compositor | grep -q "not found"
              ! ldd target/release/prime-shell | grep -q "not found"
              target/release/prime-compositor --help | tee diag/compositor-help.log
              target/release/prime-shell --help | tee diag/shell-help.log
              echo PRIME_SHELL_READINESS_V3_BUILD=PASS
            '

      - uses: actions/upload-artifact@v4
        with:
          name: prime-shell-readiness-v3-${{ github.event.pull_request.head.sha }}
          path: diag/
          if-no-files-found: error
          retention-days: 7
