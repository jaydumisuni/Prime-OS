name: TEMP Ptah Runner Status

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-ptah-runner-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: [self-hosted, kratos]
    timeout-minutes: 3
    steps:
      - name: Query runner registries
        shell: bash
        run: |
          set -euo pipefail
          echo '--- PTAH ---'
          gh api repos/jaydumisuni/Ptah-space/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
          echo '--- ORACLE ---'
          gh api repos/jaydumisuni/Oracle-/actions/runners --jq '.runners[] | {name,status,busy,os,labels:[.labels[].name]}'
